  estrellita: { intro: { es: "Tu pollito ya se sabe esta tonada en inglés. Cántasela en español y verás que entra solita.", en: "Your chick already knows this tune in English. Sing it in Spanish and watch it slip right in." },
    origen: { es: "La tonada es francesa, del siglo XVIII; Mozart le hizo variaciones, y en inglés es Twinkle, Twinkle. Hace mucho le pusimos letra en español, y en México es el arrullo que un niño oye en los dos idiomas, a veces la misma noche.", en: "The tune is French, from the 1700s; Mozart wrote variations on it, and in English it is Twinkle, Twinkle. We put Spanish words to it long ago, and in Mexico it is the lullaby a child hears in both languages, sometimes on the same night." } },
  rorro: { intro: { es: "Ésta me la cantaba mi mamá, y a ella la suya. Mécete en cada rorro y déjala ir más despacio cada vuelta.", en: "My mother sang me this one, and hers sang it to her. Rock on every rorro and let it get slower each time through." },
    origen: { es: "Es uno de los arrullos más viejos de México, de la época colonial. Rorro es una palabra antigua para el bebé en brazos. Las estrofas de la nevería y el coche se fueron agregando después, conforme el mundo cambiaba alrededor de la cuna.", en: "It is one of the oldest Mexican lullabies, from colonial times. Rorro is an old word for a baby in arms. The verses about the nevería and the coche were added later, as the world changed around the cradle." } },
  santaana: { intro: { es: "Un arrullo para cuando el pollito no se quiere dormir. Baja la voz en cada estrofa; la última casi no se oye.", en: "A lullaby for when the chick won't settle. Lower your voice on each verse; the last one is almost a whisper." },
    origen: { es: "Llegó con los españoles y se quedó en todo México, con una tonada distinta casi en cada región. Santa Ana es la abuela de Jesús, por eso a ella le preguntan por el niño que llora. La última línea, pedazo de mi corazón, todavía se dice en voz alta en las casas.", en: "It came with the Spanish and settled all over Mexico, with a different tune in almost every region. Santa Ana is the grandmother of Jesus, which is why she is the one asked about the crying child. The last line, pedazo de mi corazón, is still said out loud in our homes." } },
  elefante: { intro: { es: "Decidan juntos en qué número se rompe la telaraña. Yo siempre digo que en el cinco, y siempre me caigo primero.", en: "Decide together which number breaks the web. I always say five, and I always fall first." },
    origen: { es: "Se canta en todo el mundo de habla hispana, seguramente viene de España, y los niños mexicanos la aprendieron en el kínder durante todo el siglo pasado. No tiene final: se agregan elefantes hasta que la telaraña no aguanta.", en: "It is sung all over the Spanish-speaking world, most likely from Spain, and Mexican children learned it in kindergarten all through the last century. It has no ending: you add elephants until the web can't take it." } },
  rana: { intro: { es: "El pollito canta todos los cucú, cucú y tú lo demás. Con eso ya tienen un dueto.", en: "The chick sings every cucú, cucú and you sing the rest. That's a duet already." },
    origen: { es: "Es española, cruzó el mar y se volvió favorita en las escuelas de México. Cucú es como canta la rana en español, y cada estrofa agrega a alguien que pasa junto al charco, un juego viejo de nombrar a quien pasa.", en: "It is Spanish, crossed the ocean and became a classroom favorite in Mexico. Cucú is how a frog sings in Spanish, and each verse adds someone walking past the pond, an old game of naming who goes by." } },
  perritos: { intro: { es: "Diez dedos arriba, baja uno por estrofa, y deja que tu pollito grite el número. Los gritos son parte de la canción.", en: "Ten fingers up, fold one per verse, and let your chick shout the number. The shouting is part of the song." },
    origen: { es: "La quieren en México y en Argentina desde al menos mediados del siglo pasado, y en cada familia los perritos se van por un motivo distinto y más chistoso. Así aprendieron muchos niños a contar hacia atrás sin darse cuenta.", en: "It has been loved in Mexico and Argentina since at least the middle of the last century, and in every family the puppies leave for a different, sillier reason. That's how many children learned to count backwards without noticing." } },
  colores: { intro: { es: "Ésta se canta en la iglesia, en las marchas y en la cocina, y en las tres suena igual de bonita. Pinta el aire con las manos.", en: "This one gets sung in church, at marches and in the kitchen, and it sounds just as pretty in all three. Paint the air with your hands." },
    origen: { es: "Es una canción española muy vieja que las familias mexicanas cantan desde hace siglos. En los años sesenta los campesinos de California, con César Chávez, la hicieron su himno, y todavía se canta a los dos lados de la frontera. Para una familia de aquí y de allá, lleva los dos lugares a la vez.", en: "It is a very old Spanish song that Mexican families have sung for centuries. In the 1960s the farmworkers of California, with César Chávez, made it their anthem, and it is still sung on both sides of the border. For a family from here and there, it carries both places at once." } },
  caballito: { intro: { es: "Brinca a tu pollito en la rodilla y di el nombre de tu pueblo cuando llegues a mi pueblo. El mío es pequeñito, pero es mío.", en: "Bounce your chick on your knee and say the name of your town when you get to mi pueblo. Mine is tiny, but it's mine." },
    origen: { es: "Es de España, y México la hizo suya como canción de rodilla. El jinete le pide al caballito que lo lleve al pueblo donde nació, por eso los abuelos la cantan pensando en el suyo.", en: "It is from Spain, and Mexico made it its own as a knee-bounce song. The rider asks the little horse to carry him to the town where he was born, which is why grandparents sing it thinking of theirs." } },
  vibora: { intro: { es: "En las bodas todos pasamos por debajo del velo con esta canción, y a mí siempre me atrapan en tras, tras, tras. En casa, dos adultos hacen el arco.", en: "At weddings we all run under the veil to this song, and I always get caught on tras, tras, tras. At home two grown-ups make the arch." },
    origen: { es: "Es una ronda mexicana con raíces en un juego español del siglo XVI, y todavía se juega en cada patio de escuela. En México se volvió el juego de las bodas: los novios se suben a las sillas con el velo como puente, los invitados pasan en fila por debajo, y quien se cae es el que sigue en casarse.", en: "It is a Mexican ronda with roots in a Spanish game from the 1500s, still played in every schoolyard. In Mexico it became the wedding game: the couple stand on chairs holding the veil as a bridge, the guests snake underneath, and whoever falls is next to marry." } },
  naranja: { intro: { es: "Una ronda con un abrazo a la mitad. Y lo de los tacos al final siempre da risa, aunque uno ya sea grande.", en: "A round with a hug in the middle. And the tacos line at the end always gets a laugh, even from grown-ups." },
    origen: { es: "Se canta en México desde el siglo XIX. La marcha es la marcha militar que termina el juego, sololoy es como los niños decían celuloide, el plástico de las muñecas de antes, y la línea de los tacos es puro México.", en: "It has been sung in Mexico since the 1800s. The marcha is the military march that ends the game, sololoy is how children said celuloide, the plastic old dolls were made of, and the tacos line is Mexico's own." } },
  blanca: { intro: { es: "Un pollito es Doña Blanca en medio, los demás son sus pilares, y el jicotillo trata de romperlos. Nunca lo dejen pasar a la primera.", en: "One chick is Doña Blanca in the middle, the others are her pillars, and the jicotillo tries to break through. Never let him in on the first try." },
    origen: { es: "Es de las rondas más viejas de México, escrita desde la época colonial y todavía viva en los patios de la Ciudad de México. Un jicote es una avispa grande, del náhuatl xicotli, así que el juego lleva una palabra indígena en cada estrofa.", en: "It is one of the oldest rondas in Mexico, written down since colonial times and still alive in Mexico City schoolyards. A jicote is a big wasp, from the Nahuatl xicotli, so the game carries an indigenous word in every verse." } },
  arroz: { intro: { es: "Cántenla y luego hagan arroz con leche juntos: arroz, leche, canela y azúcar. Así la canción también se come.", en: "Sing it, then make arroz con leche together: rice, milk, cinnamon and sugar. That way the song gets eaten too." },
    origen: { es: "Se canta en toda Latinoamérica y en España desde al menos el siglo XIX. Cada país tiene sus estrofas sobre con quién se quiere casar quien canta; la mexicana pide una señorita de la capital.", en: "It has been sung all over Latin America and Spain since at least the 1800s. Every country has its own verses about whom the singer wants to marry; the Mexican one asks for a señorita de la capital." } },
  muneca: { intro: { es: "Acuna una muñeca mientras cantas. Y no te asustes con constipado: quiere decir resfriado, nada más.", en: "Cradle a doll while you sing. And don't worry about constipado: it just means a cold." },
    origen: { es: "Es española, del siglo XIX, y se volvió clásica en las casas y escuelas de México. La estrofa de los números, sumando de ocho en ocho, la agregaron los niños, y ya nadie la canta sin ella.", en: "It is Spanish, from the 1800s, and became a standard in Mexican homes and schools. The counting verse, adding by eight, was added by children, and now nobody sings it without." } },
  barquito: { intro: { es: "Cuando termina, vuelve a empezar, y tu pollito va a pedir otra vuelta. Mécete como barquito y acelera cada vez.", en: "When it ends it starts again, and your chick will ask for one more round. Rock like a boat and speed up each time." },
    origen: { es: "Viene de España y llegó a México por la escuela y la televisión. Está hecha para repetirse: cuando termina el cuento, vuelve a empezar.", en: "It comes from Spain and reached Mexico through school and television. It is built to repeat: when the story ends, it starts again." } },
  dedito: { intro: { es: "Toca un dedo por línea, del meñique al gordito, y cosquillas en la palma cuando se lo come. Nunca falla.", en: "Touch one finger per line, from the little one to the thumb, and tickle the palm when he eats it. Never fails." },
    origen: { es: "Se dice en todas las casas donde se habla español, y es más vieja de lo que nadie puede rastrear. Cada dedo hace algo con el huevo, y el pulgar, el gordito, se lo come.", en: "It is said in every home where Spanish is spoken, and it is older than anyone can trace. Each finger does a job with the egg, and the thumb, el gordito, eats it." } },
  sana: { intro: { es: "Para la rodilla raspada. Soba en círculos lentos, dila igual que siempre, y un beso en mañana.", en: "For the scraped knee. Rub in slow circles, say it the same way every time, and a kiss on mañana." },
    origen: { es: "Es la rima que cura en todo el mundo de habla hispana, de México a Argentina. Nadie sabe dónde empezó. Funciona porque siempre se dice exactamente igual.", en: "It is the healing rhyme of the whole Spanish-speaking world, from Mexico to Argentina. Nobody knows where it started. It works because it is always said exactly the same way." } },
  aserrin: { intro: { es: "Tómale las dos manos y mézanse adelante y atrás, como serruchando. Brinca en pan y en dan.", en: "Hold both hands and rock forward and back, like sawing. Bounce on pan and on dan." },
    origen: { es: "Viene de España y se canta en México y toda Sudamérica en el regazo de un adulto. Aserrín es el polvo de la madera, el vaivén de las palabras es un serrucho, y los maderos son los leñadores de San Juan.", en: "It comes from Spain and is sung in Mexico and across South America on a grown-up's lap. Aserrín is sawdust, the back-and-forth of the words is a saw, and the maderos are the woodcutters of San Juan." } },
  llueva: { intro: { es: "Para cantar en la ventana cuando llueve. Baja los dedos como gotas y una palmada grande en chaparrón.", en: "For singing at the window when it rains. Flutter your fingers like drops and one big clap on chaparrón." },
    origen: { es: "Es una canción española para llamar la lluvia, y en México la cantamos desde hace generaciones. La Virgen de la Cueva es un santuario de Cantabria del que casi ningún niño de aquí ha oído hablar, y aun así todos la cantan.", en: "It is a Spanish song for calling the rain, and in Mexico we have sung it for generations. La Virgen de la Cueva is a shrine in Cantabria that almost no child here has heard of, and they all sing it anyway." } },
  mananitas: { intro: { es: "Con las dos primeras estrofas alcanza para cualquier fiesta. Un pollito que se las sabe ya tiene lugar en todos los cumpleaños de la familia.", en: "The first two verses are enough for any party. A chick who knows them has a place at every family birthday." },
    origen: { es: "Es la canción de cumpleaños de México, con estrofas del siglo XIX y una melodía que quedó fija hacia los años veinte. Se canta antes del pastel, y a la antigua, al amanecer bajo la ventana del festejado, de preferencia con guitarra o con mariachi.", en: "It is Mexico's birthday song, with verses from the 1800s and a melody settled by the 1920s. It is sung before the cake, and in the old way at dawn under the birthday person's window, best with a guitar or a mariachi." } },
  "piñata": { intro: { es: "Todos cantan mientras el pollito vendado le pega, y el turno termina cuando termina la canción. Griten se acabó juntos.", en: "Everyone sings while the blindfolded chick swings, and the turn ends when the song ends. Shout se acabó together." },
    origen: { es: "La piñata llegó con los españoles, que la traían de Italia y de China, y los frailes de Acolman la usaron para enseñar: siete picos por siete pecados, la venda por la fe y los dulces como premio. La canción es lo que todos cantamos mientras tanto.", en: "The piñata came with the Spanish, who had it from Italy and China, and the friars of Acolman used it to teach: seven points for seven sins, the blindfold for faith, the sweets as the reward. The song is what all of us sing in the meantime." } },
};
function tiaHTML(text){ return `<div class="tia"><div class="tia-pic">${TIA_SVG}</div><div class="tia-bubble"><span class="tia-name">${TIA_NAME}</span><p class="es">${esc(text.es)}</p><p class="en">${esc(text.en)}</p></div></div>`; }
const TIA_COACH = {
  continue: { es: "Van a la mitad de esta. Cántenla completa, y luego guarden una o dos palabras.", en: "You're halfway through this one. Sing it all the way, then keep a word or two." },
  next: { es: "La anterior ya quedó. Hoy solo canten esta; mañana guardamos palabras.", en: "The last one is done. Tonight just sing this one; tomorrow we keep words." },
  first: { es: "Empecemos por la que le canto a todos mis pollitos. Hoy solo cántenla.", en: "Let's start with the one I sing to all my chicks. Tonight just sing it." },
};

/* ================= grounded interface: library, song, words, tonight ================= */
const RULE = '<svg class="rule" viewBox="0 0 600 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7c40-3 80 2 120-1s80-4 120 1s80 3 120-1s80-3 120 1s60 2 116-1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
function cardHTML(s){
  const c = catOf(s.cat); const known = KNOWN.has(s.id);
  return `<a class="card" href="#/song/${s.id}">
    <span class="glyph c-${c.c}">${IC[c.ic]}</span>
    ${s.start ? `<span class="sticker">${T(I.start_here)}</span>` : ""}
    ${known ? `<span class="stampmini">${T(I.know_short)}</span>` : ""}
    <h3>${esc(s.title)}</h3>
    <p class="first">${esc(firstLine(s))}</p></a>`;
}
function renderLibrary(){
  const v = $("#view");
  const byKind = s => KIND === "all" || s.kind === KIND;
  const groups = (FILTER === "all" ? CATS : CATS.filter(c => c.id === FILTER)).map(c => {
    const list = SONGS.filter(s => s.cat === c.id && byKind(s)); if (!list.length) return "";
    return `<section class="group"><h2>${T(c.n)}</h2>${RULE}<div class="cards">${list.map(cardHTML).join("")}</div></section>`;
  }).join("");
  const starters = FILTER === "all" && KIND === "all" ? `<section class="group"><h2>${T(I.start_here)}</h2>${RULE}<div class="cards">${SONGS.filter(s => s.start).map(cardHTML).join("")}</div></section>` : "";
  v.innerHTML = `<div>
    <div class="hero"><h1>${T(I.hero_h)}</h1><div class="pipo-hero" id="pipoHero"></div></div>
    ${!TOUR_SEEN ? `<p class="banner"><a href="#/tour/0">${T(I.banner)}</a><button class="x" type="button" aria-label="${T(I.dismiss)}" data-act="dismiss">×</button></p>` : ""}
    <nav class="filters">
      <span class="frow">${[["all", I.kind_all], ["song", I.kind_song], ["game", I.kind_game]].map(([k, n]) => `<button type="button" data-k="${k}" aria-pressed="${KIND===k}">${T(n)}</button>`).join("")}</span>
      <span class="frow">${[["all", I.all]].concat(CATS.map(c => [c.id, c.n])).map(([id, n]) => `<button type="button" data-f="${id}" aria-pressed="${FILTER===id}">${T(n)}</button>`).join("")}</span>
    </nav>
    ${starters}${groups}
  </div>`;
  killPagePipo(); pagePipo = makePipo($("#pipoHero", v)); pagePipo.set("wave"); setTimeout(()=>{ if (pagePipo) pagePipo.set("idle"); }, 2200);
  $$("[data-f]", v).forEach(b => b.addEventListener("click", ()=>{ FILTER = b.dataset.f; renderLibrary(); }));
  $$("[data-k]", v).forEach(b => b.addEventListener("click", ()=>{ KIND = b.dataset.k; renderLibrary(); }));
  const dis = $('[data-act="dismiss"]', v); if (dis) dis.addEventListener("click", ()=>{ TOUR_SEEN = true; try { localStorage.setItem("cantame-tour-seen","1"); } catch(e){} $(".banner", v).remove(); });
}

function renderSong(s){
  const c = catOf(s.cat); const lines = flatLines(s);
  const idx = SONGS.indexOf(s); const prev = SONGS[(idx - 1 + SONGS.length) % SONGS.length], next = SONGS[(idx + 1) % SONGS.length];
  let n = 0;
  const stanzas = s.stanzas.map((st, si) => `<div class="stanza">${st.map(ln => lineHTML(ln, n++)).join("")}</div>`).join("") + (s.open ? `<div class="repeat">${T(I.repeat_more)}</div>` : "");
  const tia = TIA[s.id]; const mem = tia ? tia.intro : MEMORIA[s.id], ori = tia ? tia.origen : ORIGEN[s.id];
  $("#view").innerHTML = `<div class="song">
    <a class="back" href="#/">${IC.back} ${T(I.back)}</a>
    <div class="song-head"><p class="kindline">${T(c.n)}</p><h1>${esc(s.title)}</h1></div>
    ${mem ? tiaHTML(mem) : ""}
    <div class="actions">
      <button class="btn primary lg" type="button" data-act="sing">${IC.singi} ${T(I.sing)}</button>
      <button class="btn lg" type="button" data-act="hear">${IC.play} <span>${T(I.hear)}</span></button>
    </div>
    <div class="lyrics" id="lyrics">${stanzas}</div>
    <p class="quiet"><button type="button" class="link" data-act="gloss" aria-pressed="${GLOSS}">${T(I.english)}</button> · <button type="button" class="link" data-act="slow" aria-pressed="${SLOW}">${T(I.slow)}</button><span class="voice-note" ${(!VOICE_CHECKED || VOICE) ? "hidden" : ""}> · ${T(SPEECH ? I.no_voice : I.no_speech)}</span></p>
    ${RULE}
    <section class="sec"><h2>${T(I.how)}</h2>
      <ol class="howto">${T(s.how).map(h => `<li>${esc(h)}</li>`).join("")}</ol></section>
    ${RULE}
    <section class="sec"><h2>${T(I.words)}</h2>
      <div class="vocab">${s.vocab.map(w => { const a = artFor(w.es); return `<button class="chip${isKept(w.es) ? " kept" : ""}" type="button" data-w="${esc(w.es)}">${a ? `<span class="ico">${a}</span>` : ""}<span class="tx"><span class="es">${esc(w.es)}</span><span class="en">${esc(w.en)}</span></span></button>`; }).join("")}</div>
      <div class="keeprow">${toKeep(s).length ? `<button class="btn primary" type="button" data-act="keep">${T(I.keep_btn)}</button>` : `<button class="btn" type="button" data-act="keepagain">${T(I.practice_again)}</button>`}
        <button class="stamp" type="button" data-act="know" aria-pressed="${KNOWN.has(s.id)}">${T(I.know)}</button></div></section>
    ${ori ? `${RULE}<section class="sec origin"><h2>${T(I.origin_h)}</h2><p class="es">${esc(ori.es)}</p><p class="en">${esc(ori.en)}</p></section>` : ""}
    <div class="nextprev">
      <a href="#/song/${prev.id}">${IC.back} ${esc(prev.title)}</a>
      <a class="next" href="#/song/${next.id}">${esc(next.title)} <span class="fwd">${IC.back}</span></a>
    </div>
  </div>`;
  document.body.classList.toggle("no-gloss", !GLOSS);
  const v = $("#view");
  const hot = i => { $$("#lyrics .ln.hot").forEach(x => x.classList.remove("hot")); if (i != null) { const el = $(`#lyrics .ln[data-i="${i}"]`); if (el) { el.classList.add("hot"); el.scrollIntoView({ block:"nearest", behavior:"smooth" }); } } };
  const hearBtn = $('[data-act="hear"]', v);
  const resetBtns = () => { hearBtn.setAttribute("aria-pressed","false"); hearBtn.innerHTML = `${IC.play} <span>${T(I.hear)}</span>`; hot(null); };
  $$("#lyrics .ln", v).forEach(el => {
    const go = () => { stopAll(); resetBtns(); const i = +el.dataset.i; hot(i); speak(lines[i].es); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  hearBtn.addEventListener("click", ()=>{
    if (hearBtn.getAttribute("aria-pressed") === "true") { stopAll(); resetBtns(); return; }
    stopAll(); resetBtns(); hearBtn.setAttribute("aria-pressed","true"); hearBtn.innerHTML = `${IC.stopi} <span>${T(I.stop)}</span>`;
    if (s.melody) playTune(s, hot, resetBtns); else speakLines(lines.map(l => l.es), hot, resetBtns);
  });
  $('[data-act="sing"]', v).addEventListener("click", ()=>{ history.replaceState(null, "", `#/song/${s.id}/sing`); openSing(s); });
  $('[data-act="gloss"]', v).addEventListener("click", e => { setGloss(!GLOSS); e.currentTarget.setAttribute("aria-pressed", GLOSS); });
  $('[data-act="slow"]', v).addEventListener("click", e => { SLOW = !SLOW; e.currentTarget.setAttribute("aria-pressed", SLOW); });
  const kb = $('[data-act="keep"]', v); if (kb) kb.addEventListener("click", ()=>{ history.replaceState(null, "", `#/song/${s.id}/keep`); openPractice({ song: s, items: toKeep(s), mode: "keep" }); });
  const ka = $('[data-act="keepagain"]', v); if (ka) ka.addEventListener("click", ()=>{ history.replaceState(null, "", `#/song/${s.id}/keep`); openPractice({ song: s, items: keepable(s), mode: "keep" }); });
  $$(".chip", v).forEach(ch => ch.addEventListener("click", ()=>{ stopAll(); resetBtns(); $$(".chip.hot", v).forEach(x => x.classList.remove("hot")); ch.classList.add("hot"); speak(ch.dataset.w); }));
  $('[data-act="know"]', v).addEventListener("click", e => {
    const b = e.currentTarget; const on = !KNOWN.has(s.id);
    if (on) { KNOWN.add(s.id); logEvent("known", { song: s.id }); } else KNOWN.delete(s.id); saveKnown();
    b.setAttribute("aria-pressed", on); toast(T(on ? I.saved : I.unsaved));
  });
}

function renderWords(tab){
  const v = $("#view"); const kept = keptList();
  const groups = SONGS.map(s => ({ s, ws: kept.filter(w => w.song === s.id) })).filter(g => g.ws.length);
  const header = `<div class="wtop"><div class="jar-wrap">${jarSVG(kept.length, TOTAL_KEEPABLE)}</div>
      <div><h1>${T(I.words_title)}</h1>${kept.length ? `<p class="quiet">${kept.length} · <button type="button" class="link" data-act="gloss" aria-pressed="${GLOSS}">${T(I.english)}</button></p>` : ""}</div>

const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let tourTimers = [], tourPipos = [];
function later(ms, fn){ tourTimers.push(setTimeout(fn, ms)); }
function seq(steps, loopMs){ const run = ()=>{ steps.forEach(([at, fn]) => later(at, fn)); if (loopMs && !RM) later(loopMs, run); }; run(); }
function clearTourAnim(){ tourTimers.forEach(clearTimeout); tourTimers = []; tourPipos.forEach(p => p.destroy()); tourPipos = []; const sc = document.querySelector(".tour .scene"); if (sc && sc._glit) { sc._glit.destroy(); sc._glit = null; } }
const HAND = '<svg viewBox="0 0 40 48" aria-hidden="true"><path d="M13 3.5a3.5 3.5 0 0 1 7 0V24h1.5c0-2.2 1.8-3.5 4-3.5s4 1.3 4 3.5c2.2-.6 4.5.6 4.5 3 2.3-.3 4 1.4 4 3.5V36c0 6.5-5 10.5-11.5 10.5h-4.5c-4.6 0-8.4-2.4-10.6-6.4L5 28.6c-1.1-2 .3-4.1 2.4-4.1 1.2 0 2.3.6 3 1.6L13 29z" fill="#F6D2A8" stroke="#8A5A2B" stroke-width="2" stroke-linejoin="round"/></svg>';
function addHand(scene){ const h = document.createElement("div"); h.className = "hand"; h.innerHTML = HAND; scene.appendChild(h); return h; }
function handTo(scene, hand, el, fx, fy){
  const r = el.getBoundingClientRect(), s = scene.getBoundingClientRect();
  const x = r.left - s.left + r.width * (fx == null ? 0.5 : fx), y = r.top - s.top + r.height * (fy == null ? 0.6 : fy);
  hand.style.transform = `translate(${Math.round(x - 14)}px, ${Math.round(y - 2)}px)`; hand.classList.add("show");
}
function tap(hand, el){
  hand.classList.remove("tap"); void hand.offsetWidth; hand.classList.add("tap");
  if (el) { el.classList.remove("press"); void el.offsetWidth; el.classList.add("press"); }
}
function wordsHTML(text){ return text.split(" ").map(w => `<span class="w">${esc(w)}</span>`).join(" "); }
function waves(){ return `<span class="waves" aria-hidden="true"><i></i><i></i><i></i></span>`; }

let tourState = null;
function openTour(n){
  if (!tourState) {
    const o = document.createElement("div"); o.className = "tour"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
    document.body.appendChild(o); document.body.style.overflow = "hidden";
    const key = e => { if (!tourState) return; if (e.key === "Escape") { location.hash = "#/"; } else if (e.key === "ArrowRight") tourGo(tourState.i + 1); else if (e.key === "ArrowLeft") tourGo(tourState.i - 1); };
    document.addEventListener("keydown", key);
    tourState = { el:o, key, i:0 };
  }
  tourState.i = Math.max(0, Math.min(STEPS.length - 1, n));
  drawTour();
}
function tourGo(n){
  if (n >= STEPS.length) { finishTour("#/"); return; }
  if (n < 0) return;
  location.hash = `#/tour/${n}`;
}
function finishTour(hash){
  TOUR_SEEN = true; try { localStorage.setItem("cantame-tour-seen","1"); } catch(e){}
  location.hash = hash;
}
function closeTour(){
  if (!tourState) return;
  stopAll(); clearTourAnim();
  document.removeEventListener("keydown", tourState.key);
  tourState.el.remove(); document.body.style.overflow = ""; tourState = null;
}
function drawTour(){
  clearTourAnim(); stopAll();
  const i = tourState.i, st = STEPS[i], o = tourState.el;

      <button class="x" type="button" data-act="close" aria-label="${T(I.close)}">×</button></div>

    <div class="tstage"><div class="tcard anim">
      ${eyebrow ? `<span class="eyebrow">${eyebrow}</span>` : ""}
      <h1>${T(st.h)}</h1>
      <p class="lede">${T(st.lede)}</p>
      ${sc ? sc.html() : ""}
      ${st.tryHash ? `<div class="row" style="justify-content:center;margin-top:.9rem"><button class="btn sm" type="button" data-try="${st.tryHash}">${T(I.try_it)} →</button></div>` : ""}
      ${st.cta ? `<div class="row" style="justify-content:center;margin-top:1.2rem"><button class="btn primary" type="button" data-try="${st.cta.hash}" style="padding:.8rem 1.5rem;font-size:1.08rem">${T(st.cta)}</button></div>` : ""}
    </div></div>
    <div class="tfoot">
      <button class="btn ghost" type="button" data-act="prev" ${i === 0 ? "disabled" : ""}>${IC.back} ${T(I.tour_back)}</button>
      <button class="btn ghost sm" type="button" data-act="skip" style="color:var(--muted)">${i === STEPS.length - 1 ? "" : T(I.tour_skip)}</button>
      <button class="btn primary" type="button" data-act="next">${i === 0 ? T(I.tour_start) : i === STEPS.length - 1 ? T(I.close) : T(I.tour_next)} →</button>
    </div>`;
  $('[data-act="close"]', o).addEventListener("click", ()=> finishTour("#/"));
  $('[data-act="skip"]', o).addEventListener("click", ()=> finishTour("#/"));
  $('[data-act="prev"]', o).addEventListener("click", ()=> tourGo(i - 1));
  $('[data-act="next"]', o).addEventListener("click", ()=> tourGo(i + 1));
  $$("[data-tl]", o).forEach(b => b.addEventListener("click", ()=>{ LANG = b.dataset.tl; try { localStorage.setItem("cantame-lang", LANG); } catch(e){} renderNav(); drawTour(); }));
  $$("[data-try]", o).forEach(b => b.addEventListener("click", ()=> finishTour(b.dataset.try)));
  $(".tstage", o).scrollTop = 0;
  const sceneEl = $(".scene", o);
  if (sc && sceneEl) later(60, ()=> sc.start(sceneEl));
  $('[data-act="next"]', o).focus();
}

/* ================= boot ================= */
$$(".langsw button").forEach(b => b.addEventListener("click", ()=> setLang(b.dataset.lang)));
window.addEventListener("hashchange", ()=>{ renderNav(); route(); });
document.body.classList.toggle("no-gloss", !GLOSS);
renderNav(); route();
})();
</script>
</body>
</html>
