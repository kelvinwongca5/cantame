<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cántame · Session tutorial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
</head>
<body>
<style>
  :root {
    --ground: #E9E9E1; --tablet: #F4F4EE; --surface: #FFFFFF; --surface-2: #EAEBE3;
    --ink: #1C2740; --ink-2: #3D4660; --muted: #6B7285; --line: #D3D5CC;
    --blue: #1F5FA8; --blue-soft: #DCE7F5; --rosa: #C8156F; --rosa-soft: #F9DCEB;
    --marigold: #D98E12; --marigold-soft: #FBEBC9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F131C; --tablet: #171D2A; --surface: #1F2737; --surface-2: #263043;
      --ink: #EDEEF3; --ink-2: #C9CEDC; --muted: #9AA3B8; --line: #34405A;
      --blue: #7FB0EE; --blue-soft: #1F3352; --rosa: #F26FB4; --rosa-soft: #4A1F38;
      --marigold: #F2B84B; --marigold-soft: #4A3A16;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--rosa); outline-offset: 3px; }

  /* ---------- progress header ---------- */
  .hdr { flex: none; border-bottom: 1px solid var(--line); background: var(--tablet); }
  .hdr .in { max-width: 52rem; margin: 0 auto; padding: 0.6rem 1.3rem; display: flex; align-items: center; gap: 0.9rem; }
  .hdr .brand { font-family: "Alegreya", Georgia, serif; font-style: italic; font-size: 1.15rem; }
  .hdr .where { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.13em; color: var(--muted); font-weight: 700; }
  .hdr .grow { flex: 1; }
  .langsw { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .langsw button { background: var(--surface); border: 0; padding: 0.22rem 0.6rem; font-size: 0.8rem; color: var(--muted); }
  .langsw button[aria-pressed="true"] { background: var(--ink); color: var(--tablet); font-weight: 500; }
  .track { height: 3px; background: var(--surface-2); }
  .track .fill { height: 100%; background: var(--marigold); transition: width 340ms ease; }

  /* ---------- stage ---------- */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.3rem; min-height: 0; overflow-y: auto; }
  .card { width: 100%; max-width: 40rem; }
  .card.wide { max-width: 46rem; }
  .anim { animation: rise 380ms cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .anim { animation: none; } .track .fill { transition: none; } }

  .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; color: var(--marigold); margin-bottom: 0.7rem; }
  .eyebrow.blue { color: var(--blue); } .eyebrow.rosa { color: var(--rosa); } .eyebrow.grey { color: var(--muted); }
  h1 { font-family: "Alegreya", Georgia, serif; font-weight: 500; font-size: clamp(2rem, 5.4vw, 2.9rem); line-height: 1.1; margin: 0 0 0.8rem; }
  h1.big { font-size: clamp(2.4rem, 7vw, 3.7rem); }
  .lede { font-size: 1.1rem; color: var(--ink-2); margin: 0 0 0.4rem; max-width: 34em; }
  .tiny { font-size: 0.92rem; color: var(--muted); margin: 1.1rem 0 0; max-width: 40em; }

  /* the Spanish line you say */
  .sayline { border-left: 3px solid var(--marigold); padding: 0.15rem 0 0.15rem 1.1rem; margin: 1.4rem 0 0; }
  .sayline .es { font-family: "Alegreya", Georgia, serif; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.35; margin: 0; }
  .sayline .es i { color: var(--muted); font-size: 0.78em; }
  .sayline .gl { font-size: 1rem; color: var(--ink-2); font-style: italic; margin: 0.5rem 0 0; }
  .sayline .ph { font-size: 0.83rem; color: var(--muted); margin: 0.35rem 0 0; }
  .sayline .ph b { font-variant: small-caps; letter-spacing: 0.07em; color: var(--ink-2); }

  /* do list — at most two */
  .dolist { margin: 1.3rem 0 0; padding: 0; list-style: none; }
  .dolist li { display: grid; grid-template-columns: 1.5rem 1fr; gap: 0.7rem; align-items: start; margin-bottom: 0.7rem; font-size: 1.05rem; }
  .dolist li .n { font-family: "Alegreya", Georgia, serif; color: var(--marigold); font-size: 1.2rem; line-height: 1.3; }

  /* watch / trap panels */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-top: 1.4rem; }
  @media (max-width: 680px) { .panels { grid-template-columns: 1fr; } }
  .pan { border-radius: 8px; padding: 0.9rem 1.05rem; background: var(--surface); border: 1px solid var(--line); }
  .pan.go { border-left: 3px solid var(--blue); }
  .pan.no { border-left: 3px solid var(--rosa); }
  .pan .h { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 0.35rem; }
  .pan.go .h { color: var(--blue); } .pan.no .h { color: var(--rosa); }
  .pan p { margin: 0; font-size: 0.95rem; }

  /* coach aside */
  .coach { margin-top: 1.4rem; background: var(--surface-2); border-radius: 8px; padding: 0.9rem 1.1rem; font-size: 0.95rem; color: var(--ink-2); }
  .coach b { color: var(--ink); }

  /* buttons */
  .btn { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 0.6rem 1.15rem; font-weight: 500; }
  .btn:hover { border-color: var(--ink-2); }
  .btn.primary { background: var(--ink); color: var(--tablet); border-color: var(--ink); }
  .btn.primary:hover { opacity: 0.9; }
  .btn[aria-pressed="true"] { background: var(--marigold-soft); border-color: var(--marigold); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.lg { padding: 0.8rem 1.6rem; font-size: 1.05rem; }
  a.btn { text-decoration: none; display: inline-block; }
  a.btn:hover { text-decoration: none; }
  .row { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; }

  /* widget shell */
  .w { margin-top: 1.4rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.2rem 1.3rem; }
  .w.plain { background: transparent; border: 0; padding: 0; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--marigold); opacity: 0.28; flex: none; transition: transform 90ms ease-out, opacity 90ms ease-out; }
  .dot.on { transform: scale(1.4); opacity: 1; }
  .lyr { font-family: "Alegreya", Georgia, serif; font-size: 1.35rem; line-height: 1.65; margin-top: 0.9rem; }
  .lyr .sy.hot { background: var(--marigold-soft); border-radius: 3px; }
  .voice { font-size: 0.85rem; color: var(--muted); display: flex; gap: 0.45rem; align-items: center; }
  .voice input[type=range] { width: 90px; accent-color: var(--marigold); }

  /* pulse pad */
  .pad { flex: 1; min-width: 10rem; min-height: 5.6rem; border: 2px dashed var(--line); border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-family: "Alegreya", Georgia, serif; font-size: 1.2rem; color: var(--muted); user-select: none; -webkit-user-select: none; touch-action: manipulation; text-align: center; }
  .pad:active { background: var(--marigold-soft); border-color: var(--marigold); }
  .bpmbox { min-width: 7rem; text-align: center; }
  .bpmbox .k { font-family: "Alegreya", Georgia, serif; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .bpmbox .u { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .meter { height: 10px; border-radius: 5px; background: var(--surface-2); position: relative; margin: 0.9rem 0 0.25rem; }
  .meter .band { position: absolute; top: 0; bottom: 0; left: 28.57%; width: 21.43%; background: var(--blue-soft); border-radius: 5px; }
  .meter .pin { position: absolute; top: -4px; width: 3px; height: 18px; background: var(--ink); border-radius: 2px; transition: left 150ms ease-out; }
  .mlab { position: relative; display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); }
  .mlab .mid { position: absolute; left: 28.57%; color: var(--blue); }
  .verdict { font-family: "Alegreya", Georgia, serif; font-size: 1.3rem; margin-top: 0.8rem; min-height: 1.6em; }
  .verdict.ok { color: var(--blue); } .verdict.fast { color: var(--rosa); } .verdict.slow { color: var(--marigold); }

  /* rings */
  .ring { display: grid; place-items: center; }
  .ring svg { width: 128px; height: 128px; }
  .ring .trk { fill: none; stroke: var(--line); stroke-width: 6; }
  .ring .arc { fill: none; stroke: var(--marigold); stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .ring .num { font-family: "Alegreya", Georgia, serif; font-size: 1.8rem; fill: var(--ink); }
  .breathring { width: 96px; height: 96px; border-radius: 50%; background: var(--blue-soft); border: 2px solid var(--blue); transition: transform 4s ease-in-out; }
  .breathring.in { transform: scale(1.85); }
  @media (prefers-reduced-motion: reduce) { .breathring { transition: none; } .dot { transition: none; } }

  /* syllable + card widgets */
  .chips { display: flex; gap: 0.55rem; flex-wrap: wrap; }
  .chips button { font-family: "Alegreya", Georgia, serif; font-size: 1.6rem; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 0.4rem 0.95rem; min-width: 3.4rem; }
  .chips button[aria-pressed="true"] { border-color: var(--marigold); background: var(--marigold-soft); }
  .chips button:disabled { opacity: 0.3; }
  .slots { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.9rem; }
  .slot { min-width: 3.6rem; height: 3.2rem; border: 2px dashed var(--line); border-radius: 7px; display: grid; place-items: center; font-family: "Alegreya", Georgia, serif; font-size: 1.7rem; }
  .slot.filled { border-style: solid; border-color: var(--blue); background: var(--blue-soft); }
  .built { font-family: "Alegreya", Georgia, serif; font-size: 1.7rem; color: var(--blue); margin-left: 0.5rem; }
  .stages { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .taps { display: flex; gap: 0.7rem; }
  .taps .t { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--marigold); cursor: pointer; }
  .taps .t.on { background: var(--marigold); }

  /* child page preview */
  .childpg { background: var(--tablet); border: 1px solid var(--line); border-radius: 8px; padding: 1.4rem 1.5rem; }
  .childpg .lab { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; margin-bottom: 0.5rem; }
  .childpg .song { font-family: "Alegreya", Georgia, serif; font-size: 1.5rem; line-height: 1.6; margin: 0; }
  .childpg .song .lt { color: var(--muted); }
  .childpg .verse { font-family: "Alegreya", Georgia, serif; font-size: 1.7rem; line-height: 1.65; margin: 0; padding-left: 1rem; border-left: 4px solid var(--marigold); }
  .childpg .verse b { font-weight: 500; border-bottom: 3px solid var(--rosa); }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; }
  @media (max-width: 680px) { .cols2 { grid-template-columns: 1fr; } }

  /* the arc map */
  .map { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.4rem; margin-top: 1.4rem; }
  @media (max-width: 620px) { .map { grid-template-columns: repeat(3, 1fr); } }
  .map .m { border-radius: 6px; padding: 0.55rem 0.5rem; border: 1px solid var(--line); background: var(--surface); text-align: center; }
  .map .m.settle { background: var(--marigold-soft); border-color: var(--marigold); }
  .map .m.work { background: var(--blue-soft); border-color: var(--blue); }
  .map .m.now { outline: 2px solid var(--ink); }
  .map .m .mm { font-family: "Alegreya", Georgia, serif; font-size: 1.25rem; line-height: 1; }
  .map .m .nn { font-size: 0.72rem; margin-top: 0.15rem; }

  /* summary */
  .sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7rem; margin-top: 1.3rem; }
  .sum .c { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.8rem 0.9rem; }
  .sum .c .k { font-family: "Alegreya", Georgia, serif; font-size: 1.7rem; line-height: 1.1; }
  .sum .c .u { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-top: 0.2rem; }

  /* ---------- footer nav ---------- */
  .nav { flex: none; border-top: 1px solid var(--line); background: var(--tablet); }
  .nav .in { max-width: 52rem; margin: 0 auto; padding: 0.75rem 1.3rem; display: flex; align-items: center; gap: 0.8rem; }
  .nav .grow { flex: 1; }
  .nav .hint { font-size: 0.82rem; color: var(--muted); }
  .steps { display: flex; gap: 4px; }
  .steps i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
  .steps i.on { background: var(--marigold); }
  .steps i.past { background: var(--ink-2); }
</style>

<header class="hdr">
  <div class="in">
    <span class="brand">Cántame</span>
    <span class="where" id="where"></span>
    <span class="grow"></span>
    <div class="langsw" role="group" aria-label="Language">
      <button id="btnEn" aria-pressed="true">EN</button>
      <button id="btnEs" aria-pressed="false">ES</button>
    </div>
  </div>
  <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
</header>

<main class="stage"><div class="card anim" id="card"></div></main>

<nav class="nav">
  <div class="in">
    <button class="btn" id="back"></button>
    <span class="steps" id="dots"></span>
    <span class="grow"></span>
    <span class="hint" id="hint"></span>
    <button class="btn primary lg" id="next"></button>
  </div>
</nav>

<script>
(function(){
"use strict";

/* ============ language ============ */
var root = document.documentElement, LANG = "en";
function T(o){ if(o == null) return ""; return (typeof o === "string") ? o : (o[LANG] || o.en || ""); }

/* ============ audio ============ */
var DEG = { do:0, re:2, mi:4, fa:5, sol:7, la:9 };
var LINE_NOTES = [
  ["do","re","mi","fa","sol","sol"],
  ["la","la","la","la","sol","sol"],
  ["fa","fa","fa","fa","mi","mi"],
  ["re","re","re","re","do","do"]
];
var DUR = [0.5,0.5,0.5,0.5,1,1];
var ST1 = [ ["Los","po","-lli","-tos","di","-cen"], ["pí","-o","pí","-o","pí","-o"], ["cuan","-do","tie","-nen","ham","-bre"], ["cuan","-do","tie","-nen","frí","-o"] ];
var ST3 = [ ["Ba","-jo","sus","dos","a","-las"], ["a","-cu","-rru","-ca","-di","-tos"], ["has","-ta el","o","-tro","dí","-a"], ["duer","-men","los","po","-lli","-tos"] ];
var PUNCT = [",", ",", ",", "."];

var ctx = null, master = null, vol = 0.55;
function audio(){
  if(ctx) return ctx;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = vol * 0.5; master.connect(ctx.destination);
  return ctx;
}
function setVol(v){ vol = v; if(master) master.gain.setTargetAtTime(vol*0.5, ctx.currentTime, 0.02); }

function note(freq, t0, dur, hum){
  var c = audio();
  var g = c.createGain(); g.gain.setValueAtTime(0.0001, t0);
  var a = Math.min(0.08, dur*0.25), r = Math.min(0.12, dur*0.3), lvl = hum ? 0.7 : 0.9;
  g.gain.exponentialRampToValueAtTime(lvl, t0+a);
  g.gain.setValueAtTime(lvl, t0+dur-r);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  var lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = hum ? 700 : 1400; lp.Q.value = 0.7;
  var o1 = c.createOscillator(); o1.type = "sine"; o1.frequency.value = freq;
  var o2 = c.createOscillator(); o2.type = "triangle"; o2.frequency.value = freq*2;
  var g2 = c.createGain(); g2.gain.value = hum ? 0.06 : 0.16;
  var lfo = c.createOscillator(); lfo.frequency.value = 5.2;
  var lg = c.createGain(); lg.gain.value = freq*0.004;
  lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
  o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(master);
  o1.start(t0); o2.start(t0); lfo.start(t0);
  var end = t0+dur+0.05; o1.stop(end); o2.stop(end); lfo.stop(end);
}
var current = null;
function stopAudio(){
  if(current){ current.cancel(); current = null; }
  if(ctx && master){
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.03);
    setTimeout(function(){ if(master) master.gain.setTargetAtTime(vol*0.5, ctx.currentTime, 0.02); }, 150);
  }
}
/* sing N lines of a stanza; opts {bpm,hum,lines,pauseAfterLine,pauseSec,onSyl,onPause,onEnd} */
function sing(opts){
  stopAudio();
  var c = audio(); if(c.state === "suspended") c.resume();
  var beat = 60/opts.bpm, t = c.currentTime + 0.15, timers = [];
  function at(when, fn){ timers.push(setTimeout(fn, Math.max(0,(when - c.currentTime)*1000))); }
  var lines = opts.lines || [0,1,2,3];
  lines.forEach(function(li){
    for(var k=0;k<6;k++){
      var f = 293.66 * Math.pow(2, DEG[LINE_NOTES[li][k]]/12) * (opts.hum ? 0.5 : 1);
      var d = DUR[k]*beat;
      note(f, t, d*0.95, opts.hum);
      if(opts.onSyl){ (function(l,kk,w){ at(w, function(){ opts.onSyl(l,kk); }); })(li,k,t); }
      t += d;
    }
    if(opts.pauseAfterLine === li && opts.pauseSec){
      if(opts.onPause){ (function(w,s){ at(w, function(){ opts.onPause(s); }); })(t, opts.pauseSec); }
      t += opts.pauseSec;
    }
  });
  at(t+0.1, function(){ current = null; if(opts.onEnd) opts.onEnd(); });
  current = { cancel: function(){ timers.forEach(clearTimeout); } };
  return current;
}

/* ============ the tutorial script ============ */

  {m:1, n:"Arrullo",        k:"settle"},

];

var S = [
/* ---------- welcome ---------- */
{ part:{en:"Welcome",es:"Bienvenida"},
  eye:{en:"A coached run-through",es:"Un recorrido guiado"}, eyeClass:"grey",
  h:{en:"How to run a session",es:"Cómo dar una sesión"}, big:true,
  lede:{en:"Fifteen minutes. One adult. One child. I will take you through it once, slowly — three rehearsals first, then the six steps.",
        es:"Quince minutos. Una persona adulta. Un niño. Te llevo una vez, despacio: primero tres ensayos y luego los seis pasos."},
  tiny:{en:"You do not need to read Spanish fluently. Every line you say is glossed.",

  cta:{en:"Begin",es:"Empezar"} },

{ part:{en:"Welcome",es:"Bienvenida"},
  eye:{en:"The shape",es:"La forma"}, eyeClass:"grey",
  h:{en:"Settle, work, stretch, settle",es:"Calmar, trabajar, estirar, calmar"},
  lede:{en:"Six parts, always this order — so that a grandfather on day three and an aide on day ninety run the same session.",
        es:"Seis partes, siempre en este orden, para que un abuelo en el día tres y una asistente en el día noventa den la misma sesión."},
  widget:"map",
  tiny:{en:"Amber is the quiet register. Blue is the work. You never raise your voice in any of it.",

/* ---------- rehearsal 1 ---------- */
{ part:{en:"Rehearsal 1 of 3",es:"Ensayo 1 de 3"},
  eye:{en:"Rehearsal 1 · the tune",es:"Ensayo 1 · la tonada"},
  h:{en:"Learn the tune first",es:"Primero apréndete la tonada"},
  lede:{en:"Never in front of the child. Play it now and listen for the long notes at the end of each line.",
        es:"Nunca frente al niño. Tócala ahora y escucha las notas largas al final de cada línea."},
  widget:"tune",
  gate:{en:"Play it once to continue",es:"Tócala una vez para seguir"},
  tiny:{en:"One tune carries all three stanzas. That repetition is not laziness — it is why the words stick.",

{ part:{en:"Rehearsal 1 of 3",es:"Ensayo 1 de 3"},
  eye:{en:"Rehearsal 1 · the tune",es:"Ensayo 1 · la tonada"},
  h:{en:"Now hum it back",es:"Ahora tararéala"},
  lede:{en:"Lips closed, an octave down, slower than feels natural. This is the sound that opens every session.",

  }
  if(s.dos){
    h += '<ul class="dolist">';
    s.dos.forEach(function(d, n){ h += '<li><span class="n">' + (n+1) + "</span><span>" + T(d) + "</span></li>"; });
    h += "</ul>";
  }
  if(s.widget) h += '<div class="w' + (W[s.widget].plain ? " plain" : "") + '" id="wbox">' + W[s.widget].html(s) + "</div>";

  if(s.watch || s.trap){
    h += '<div class="panels">';
    if(s.watch) h += '<div class="pan go"><div class="h">' + (LANG==="es"?"Bien":"Good") + '</div><p>' + T(s.watch) + "</p></div>";
    if(s.trap)  h += '<div class="pan no"><div class="h">' + (LANG==="es"?"Cuidado":"Careful") + '</div><p>' + T(s.trap) + "</p></div>";
    h += "</div>";
  }
  if(s.coach) h += '<div class="coach">' + T(s.coach) + "</div>";
  if(s.tiny) h += '<p class="tiny">' + T(s.tiny) + "</p>";

  card.className = "card anim" + (s.wide ? " wide" : "");
  card.innerHTML = h;
  void card.offsetWidth;

  if(s.widget){
    var box = document.getElementById("wbox");
    W[s.widget].wire(box, function(){ unlocked[i] = true; refreshNav(); });
    if(box._cleanup) card._cleanup = box._cleanup;
  }

  whereEl.textContent = T(s.part);
  fill.style.width = ((i+1)/S.length*100) + "%";

  var pIdx = PARTS.indexOf(s.part.en);
  var d = "";
  for(var k=0;k<PARTS.length;k++) d += "<i class='" + (k < pIdx ? "past" : (k === pIdx ? "on" : "")) + "'></i>";
  dotsEl.innerHTML = d;

  refreshNav();
  card.scrollIntoView({ block:"nearest" });
  document.querySelector(".stage").scrollTop = 0;
}

function refreshNav(){
  var s = S[i];
  var gated = !!s.gate && !unlocked[i];
  backBtn.textContent = LANG === "es" ? "Atrás" : "Back";
  backBtn.disabled = i === 0;
  backBtn.style.visibility = i === 0 ? "hidden" : "visible";
  nextBtn.textContent = s.cta ? T(s.cta) : (i === S.length-1 ? (LANG==="es"?"Fin":"Done") : (LANG==="es"?"Siguiente":"Next"));
  nextBtn.disabled = gated || i === S.length-1;
  hintEl.textContent = gated ? T(s.gate) : "";
}

function go(n){
  i = Math.max(0, Math.min(S.length-1, n));
  render();
}
nextBtn.addEventListener("click", function(){ if(!nextBtn.disabled) go(i+1); });
backBtn.addEventListener("click", function(){ go(i-1); });
document.addEventListener("keydown", function(e){
  if(e.target.tagName === "INPUT" || e.target.classList.contains("pad")) return;
  if(e.key === "ArrowRight" && !nextBtn.disabled) go(i+1);
  if(e.key === "ArrowLeft" && i > 0) go(i-1);
});

/* ============ language switch ============ */
var btnEn = document.getElementById("btnEn"), btnEs = document.getElementById("btnEs");
function setLang(l){
  LANG = l;
  root.setAttribute("data-lang", l);
  root.setAttribute("lang", l);
  btnEn.setAttribute("aria-pressed", l === "en");
  btnEs.setAttribute("aria-pressed", l === "es");
  try { localStorage.setItem("cantame-lang", l); } catch(err){}
  render();
}
btnEn.addEventListener("click", function(){ if(LANG !== "en") setLang("en"); });
btnEs.addEventListener("click", function(){ if(LANG !== "es") setLang("es"); });

var saved = null;
try { saved = localStorage.getItem("cantame-lang"); } catch(err){}
if(!saved && (navigator.language||"").toLowerCase().indexOf("es") === 0) saved = "es";
LANG = saved === "es" ? "es" : "en";
setLang(LANG);
})();
</script>

</body>
</html>
