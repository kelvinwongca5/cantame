<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cántame Cancionero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap">
</head>
<body>
<style>
  :root {
    --ground: #FBF3E2; --card: #FFFFFF; --soft: #FDEBCB; --soft2: #F3EEDF;
    --ink: #2A2418; --ink-2: #574C38; --muted: #8A7C64; --line: #E7D9BC;
    --blue: #1F6F9E; --blue-soft: #D9EDF7; --rosa: #D6337B; --rosa-soft: #FCE0EC;
    --marigold: #F2A62C; --marigold-deep: #C97C10; --marigold-soft: #FDEBCB;
    --green: #4C9A5A; --green-soft: #DDF0DE; --morado: #6B4FA0; --morado-soft: #E9E2F5;
    --on-marigold: #3A2A08; --shadow: 0 2px 8px rgba(60,40,10,.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #221D14; --card: #2E2719; --soft: #3E3117; --soft2: #332C1E;
      --ink: #FBF3E2; --ink-2: #E4D8BF; --muted: #B0A085; --line: #4A3E28;
      --blue: #7FC3E8; --blue-soft: #1E3B4C; --rosa: #F98CBB; --rosa-soft: #4B2035;
      --marigold: #F5B948; --marigold-deep: #F5B948; --marigold-soft: #3E3117;
      --green: #8CCB97; --green-soft: #24381F; --morado: #B9A3E6; --morado-soft: #33294A;
      --on-marigold: #2A1E05; --shadow: 0 2px 8px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #221D14; --card: #2E2719; --soft: #3E3117; --soft2: #332C1E;
    --ink: #FBF3E2; --ink-2: #E4D8BF; --muted: #B0A085; --line: #4A3E28;
    --blue: #7FC3E8; --blue-soft: #1E3B4C; --rosa: #F98CBB; --rosa-soft: #4B2035;
    --marigold: #F5B948; --marigold-deep: #F5B948; --marigold-soft: #3E3117;
    --green: #8CCB97; --green-soft: #24381F; --morado: #B9A3E6; --morado-soft: #33294A;
    --on-marigold: #2A1E05; --shadow: 0 2px 8px rgba(0,0,0,.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--blue); text-underline-offset: 2px; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; border-radius: 6px; }
  h1, h2, h3 { font-family: "Alegreya", Georgia, serif; font-weight: 500; line-height: 1.12; margin: 0; text-wrap: balance; font-variant-numeric: lining-nums; }
  .serif { font-family: "Alegreya", Georgia, serif; }
  .label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .hidden, [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- header with papel picado ---------- */
  .hdr { flex: none; position: relative; }
  .picado { display: block; width: 100%; height: 38px; }
  .hdr .in { max-width: 62rem; margin: 0 auto; padding: 0.4rem 1.2rem 0.9rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .brand { font-family: "Alegreya", Georgia, serif; font-style: italic; font-size: 1.55rem; color: var(--marigold-deep); text-decoration: none; display: flex; align-items: baseline; gap: 0.5rem; }
  .brand small { font-family: "Alegreya Sans", system-ui, sans-serif; font-style: normal; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  .nav { display: flex; gap: 0.2rem; }
  .nav a { text-decoration: none; color: var(--ink-2); font-weight: 700; padding: 0.35rem 0.8rem; border-radius: 999px; font-size: 0.98rem; }
  .nav a[aria-current="page"] { background: var(--soft); color: var(--marigold-deep); }
  .nav a:hover { color: var(--ink); }
  .grow { flex: 1; }
  .langsw { display: flex; background: var(--soft2); border-radius: 999px; padding: 3px; gap: 2px; }
  .langsw button { background: transparent; border: 0; padding: 0.25rem 0.75rem; font-size: 0.88rem; color: var(--muted); border-radius: 999px; font-weight: 700; }
  .langsw button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  @media (max-width: 560px) {
    .hdr .in { gap: 0.4rem 0.5rem; padding-bottom: 0.7rem; }
    .brand { width: 100%; }
    .nav a { padding: 0.3rem 0.55rem; font-size: 0.92rem; }
    .langsw button { padding: 0.22rem 0.55rem; font-size: 0.82rem; }
  }

  /* ---------- page shell ---------- */
  main { flex: 1; width: 100%; max-width: 62rem; margin: 0 auto; padding: 0.6rem 1.2rem 3rem; }
  .fade { animation: fade 360ms cubic-bezier(.2,.8,.3,1) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade, .anim { animation: none !important; } * { transition: none !important; } }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; gap: 0.45rem; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 0.5rem 1.05rem; font-weight: 700; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); line-height: 1.2; }
  .btn:hover { border-color: var(--marigold); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--marigold); border-color: var(--marigold); color: var(--on-marigold); }
  .btn.primary:hover { background: var(--marigold-deep); border-color: var(--marigold-deep); }
  .btn[aria-pressed="true"] { background: var(--soft); border-color: var(--marigold); color: var(--ink); }
  .btn.sm { padding: 0.32rem 0.8rem; font-size: 0.9rem; box-shadow: none; }
  .btn.ghost { background: transparent; box-shadow: none; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn svg { width: 1.1em; height: 1.1em; flex: none; }
  .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }

  /* ---------- pills (category) ---------- */
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; font-weight: 700; padding: 0.18rem 0.7rem; border-radius: 999px; letter-spacing: 0.01em; }
  .pill svg { width: 0.95em; height: 0.95em; }
  .c-blue { color: var(--blue); background: var(--blue-soft); }
  .c-green { color: var(--green); background: var(--green-soft); }
  .c-rosa { color: var(--rosa); background: var(--rosa-soft); }
  .c-marigold { color: var(--marigold-deep); background: var(--marigold-soft); }
  .c-morado { color: var(--morado); background: var(--morado-soft); }
  .stripe-blue { border-left-color: var(--blue) !important; } .stripe-green { border-left-color: var(--green) !important; }
  .stripe-rosa { border-left-color: var(--rosa) !important; } .stripe-marigold { border-left-color: var(--marigold) !important; }
  .stripe-morado { border-left-color: var(--morado) !important; }

  /* ---------- library ---------- */
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 1rem 2rem; align-items: end; margin: 0.6rem 0 1.2rem; }
  .hero h1 { font-size: clamp(2rem, 5vw, 2.9rem); font-style: italic; }
  .hero p { margin: 0.4rem 0 0; color: var(--ink-2); max-width: 46ch; font-size: 1.05rem; }
  .hero .stat { text-align: right; color: var(--muted); font-size: 0.95rem; }
  .hero .stat b { display: block; font-family: "Alegreya", Georgia, serif; font-size: 2rem; color: var(--marigold-deep); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
  @media (max-width: 640px) { .hero { grid-template-columns: 1fr; } .hero .stat { text-align: left; } }

  .banner { display: flex; align-items: center; gap: 0.9rem; background: var(--soft); border-radius: 18px; padding: 0.85rem 1.1rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .banner .pic { width: 44px; height: 44px; flex: none; }
  .banner p { margin: 0; flex: 1; min-width: 14rem; }
  .banner .x { background: none; border: 0; color: var(--muted); font-size: 1.2rem; padding: 0.2rem 0.5rem; }

  .filters { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .filters button { border: 2px solid transparent; background: var(--soft2); border-radius: 999px; padding: 0.35rem 0.9rem; font-weight: 700; font-size: 0.92rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: 0.4rem; }
  .filters button svg { width: 1em; height: 1em; }
  .filters button[aria-pressed="true"] { background: var(--card); border-color: var(--marigold); color: var(--ink); box-shadow: var(--shadow); }
  .filters button:hover { color: var(--ink); }

  .group { margin-bottom: 1.6rem; }
  .group h2 { font-size: 1.35rem; display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.2rem; }
  .group h2 .pill { font-family: "Alegreya Sans", system-ui, sans-serif; }
  .group .desc { color: var(--muted); margin: 0 0 0.7rem; font-size: 0.95rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 0.8rem; }
  .card { position: relative; display: block; text-decoration: none; color: inherit; background: var(--card); border-radius: 16px; border-left: 6px solid var(--line); padding: 0.9rem 1rem 0.85rem 1rem; box-shadow: var(--shadow); transition: transform 120ms ease, box-shadow 120ms ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(60,40,10,.12); }
  .card h3 { font-size: 1.32rem; font-weight: 500; }
  .card .first { font-family: "Alegreya", Georgia, serif; font-style: italic; color: var(--muted); font-size: 1rem; margin: 0.15rem 0 0.5rem; }
  .card .meta { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
  .card .meta .tag { display: inline-flex; align-items: center; gap: 0.25rem; }
  .card .meta svg { width: 0.95em; height: 0.95em; }
  .card .start { position: absolute; top: -0.55rem; right: 0.8rem; background: var(--rosa); color: #fff; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.15rem 0.6rem; border-radius: 999px; }
  .card .known { position: absolute; top: 0.75rem; right: 0.8rem; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; }

  /* ---------- song page ---------- */
  .back { display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; text-decoration: none; color: var(--muted); font-weight: 700; font-size: 0.92rem; margin-bottom: 0.6rem; }
  .back:hover { color: var(--ink); }
  .song-head { margin-bottom: 1rem; }
  .song-head h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin: 0.35rem 0 0.2rem; }
  .song-head .also { color: var(--muted); font-style: italic; font-family: "Alegreya", Georgia, serif; font-size: 1.1rem; }
  .note { background: var(--soft); border-radius: 18px; padding: 0.9rem 1.15rem; margin: 0.9rem 0 1.1rem; display: flex; gap: 0.8rem; align-items: flex-start; }
  .note .ic { flex: none; width: 2rem; height: 2rem; border-radius: 50%; background: var(--marigold); color: var(--on-marigold); display: grid; place-items: center; font-family: "Alegreya", Georgia, serif; font-weight: 700; font-style: italic; }
  .note p { margin: 0; color: var(--ink-2); font-size: 1rem; max-width: 70ch; }
  .note p b { color: var(--ink); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: center; margin-bottom: 1.1rem; }
  .toolbar .sep { flex: 1; }
  .voice-note { font-size: 0.85rem; color: var(--muted); width: 100%; }

  .song-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(16rem, 1fr); gap: 1.6rem; align-items: start; }
  @media (max-width: 760px) { .song-grid { grid-template-columns: 1fr; } }

  .lyrics { background: var(--card); border-radius: 22px; padding: 1.2rem 1.4rem 1.3rem; box-shadow: var(--shadow); }
  .stanza { padding: 0.35rem 0; }
  .stanza + .stanza { border-top: 1px dashed var(--line); margin-top: 0.5rem; padding-top: 0.85rem; }
  .stanza .cue { font-size: 0.78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.2rem; }
  .ln { display: grid; grid-template-columns: 1fr auto; gap: 0 0.6rem; align-items: center; padding: 0.22rem 0.5rem; margin: 0 -0.5rem; border-radius: 10px; cursor: pointer; }
  .ln:hover { background: var(--soft2); }
  .ln.hot { background: var(--marigold-soft); box-shadow: inset 0 0 0 2px var(--marigold); }
  .ln .es { grid-column: 1; grid-row: 1; font-family: "Alegreya", Georgia, serif; font-size: 1.36rem; line-height: 1.35; }
  .ln .en { grid-column: 1; grid-row: 2; font-size: 0.93rem; color: var(--muted); line-height: 1.3; margin-top: 0.05rem; }
  .ln .spk { grid-column: 2; grid-row: 1 / span 2; background: none; border: 0; color: var(--muted); padding: 0.2rem; border-radius: 50%; opacity: 0.55; }
  .ln:hover .spk, .ln.hot .spk { opacity: 1; color: var(--marigold-deep); }
  .ln .spk svg { width: 1.25rem; height: 1.25rem; display: block; }
  .no-gloss .ln .en { display: none; }
  .no-gloss .ln .spk { grid-row: 1; }
  .repeat { color: var(--muted); font-style: italic; font-family: "Alegreya", Georgia, serif; font-size: 1rem; padding: 0.3rem 0; }

  .side { display: flex; flex-direction: column; gap: 1rem; }
  .panel { background: var(--card); border-radius: 20px; padding: 1rem 1.15rem; box-shadow: var(--shadow); }
  .panel h2 { font-size: 1.2rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .panel h2 svg { width: 1.15em; height: 1.15em; color: var(--marigold-deep); }
  .howto { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .howto li { display: flex; gap: 0.65rem; align-items: flex-start; font-size: 0.98rem; }
  .howto li .n { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--marigold); color: var(--on-marigold); display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; margin-top: 0.05rem; }
  .vocab { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .chip { border: 2px solid var(--line); background: var(--soft2); border-radius: 12px; padding: 0.35rem 0.7rem; text-align: left; line-height: 1.15; display: flex; flex-direction: column; gap: 0.05rem; }
  .chip:hover { border-color: var(--marigold); }
  .chip.hot { border-color: var(--marigold); background: var(--marigold-soft); }
  .chip .es { font-family: "Alegreya", Georgia, serif; font-size: 1.12rem; font-weight: 500; }
  .chip .en { font-size: 0.8rem; color: var(--muted); }
  .no-gloss .chip .en { display: none; }
  .know { width: 100%; justify-content: center; padding: 0.7rem 1rem; }
  .know[aria-pressed="true"] { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .panel .tip { margin: 0.5rem 0 0; font-size: 0.9rem; color: var(--muted); }
  .nextprev { display: flex; justify-content: space-between; gap: 0.6rem; margin-top: 1.4rem; flex-wrap: wrap; }
  .nextprev a { flex: 1; min-width: 12rem; text-decoration: none; color: inherit; background: var(--card); border-radius: 14px; padding: 0.7rem 1rem; box-shadow: var(--shadow); }
  .nextprev a small { display: block; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .nextprev a b { font-family: "Alegreya", Georgia, serif; font-weight: 500; font-size: 1.15rem; }
  .nextprev a.next { text-align: right; }

  /* ---------- sing-along overlay: a scrolling reel ---------- */
  .sing { position: fixed; inset: 0; background: var(--ground); z-index: 50; display: flex; flex-direction: column; }
  .sing .top { display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.1rem; flex-wrap: wrap; }
  .sing .top .title { font-family: "Alegreya", Georgia, serif; font-style: italic; font-size: 1.15rem; color: var(--marigold-deep); }
  .sing .top .count { color: var(--muted); font-variant-numeric: lining-nums tabular-nums; font-weight: 700; margin-right: 0.4rem; }
  .sing .reelwrap { flex: 1; position: relative; overflow: hidden; min-height: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%); }
  .sing .reel { position: absolute; left: 0; right: 0; top: 0; padding: 0 1.4rem; transition: transform 650ms cubic-bezier(.22,.85,.25,1); will-change: transform; }
  .sing .rline { text-align: center; padding: 0.55rem 0; opacity: 0.28; transform: scale(.58); transform-origin: 50% 50%; cursor: pointer; transition: transform 650ms cubic-bezier(.22,.85,.25,1), opacity 650ms; user-select: none; }
  .sing .rline.near { opacity: 0.45; }
  .sing .rline.cur { opacity: 1; transform: none; cursor: default; }
  .sing .rline:hover:not(.cur) { opacity: 0.7; }
  .sing .rcue { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 0.3rem; }
  .sing .rtext { font-family: "Alegreya", Georgia, serif; font-size: clamp(2rem, 6.5vw, 4.2rem); line-height: 1.22; text-wrap: balance; max-width: 18ch; margin: 0 auto; }
  .sing .rgl { font-size: clamp(1rem, 2.3vw, 1.4rem); color: var(--muted); margin-top: 0.45rem; opacity: 0; transition: opacity 400ms; max-width: 44ch; margin-left: auto; margin-right: auto; }
  .sing .rline.cur .rgl { opacity: 1; }
  .sing.no-gl .rgl { display: none; }
  .sing .w { display: inline-block; padding: 0 0.12em; border-radius: 0.2em; transition: background 140ms, box-shadow 140ms; }
  .sing .rline.cur .w.on { background: var(--marigold-soft); box-shadow: 0 0 0 3px var(--marigold); }
  .sing .bar { height: 5px; background: var(--soft2); margin: 0.4rem 1.4rem 0; border-radius: 999px; overflow: hidden; }
  .sing .bar i { display: block; height: 100%; width: 0; background: var(--marigold); border-radius: 999px; transition: width 400ms; }
  .sing .ctl { display: flex; gap: 0.6rem; justify-content: center; align-items: center; padding: 0.9rem 1.2rem 0.3rem; flex-wrap: wrap; }
  .sing .ctl .btn.lg { padding: 0.8rem 1.5rem; font-size: 1.1rem; }
  .sing .ctl .btn[aria-label] { padding: 0.75rem; border-radius: 50%; }
  .sing .ctl .btn[aria-label] svg { width: 1.2rem; height: 1.2rem; }
  .sing .hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0 1rem 1rem; }
  .sing.playing .hint { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .sing .reel, .sing .rline { transition: none; } }

  /* ---------- words page ---------- */
  .tabs { display: flex; gap: 0.4rem; margin: 0.4rem 0 1.2rem; }
  .tabs button { border: 2px solid transparent; background: var(--soft2); border-radius: 999px; padding: 0.4rem 1rem; font-weight: 700; color: var(--ink-2); }
  .tabs button[aria-pressed="true"] { background: var(--card); border-color: var(--marigold); color: var(--ink); box-shadow: var(--shadow); }
  .flash { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.7rem; }
  .fc { position: relative; min-height: 7.4rem; border: 0; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 0.9rem 0.9rem 0.8rem; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 0.3rem; }
  .fc .w { font-family: "Alegreya", Georgia, serif; font-size: 1.5rem; font-weight: 500; line-height: 1.15; }
  .fc .m { font-size: 0.92rem; color: var(--muted); min-height: 1.3em; }
  .fc .from { font-size: 0.75rem; color: var(--muted); font-style: italic; font-family: "Alegreya", Georgia, serif; }
  .fc.flipped { background: var(--soft); }
  .fc .hear { position: absolute; top: 0.6rem; right: 0.6rem; background: none; border: 0; color: var(--muted); padding: 0.2rem; }
  .fc .hear svg { width: 1.2rem; height: 1.2rem; display: block; }
  .fc:hover .hear { color: var(--marigold-deep); }
  .phrases { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 0.7rem; }
  .ph { background: var(--card); border-radius: 16px; padding: 0.85rem 1rem; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 0 0.6rem; align-items: center; }
  .ph .es { grid-column: 1; grid-row: 1; font-family: "Alegreya", Georgia, serif; font-size: 1.4rem; font-weight: 500; }
  .ph .en { grid-column: 1; grid-row: 2; color: var(--muted); font-size: 0.95rem; }

  how:{en:["Pat the child's back slowly on the beat.","Lower your voice on each verse; the last one is almost a whisper.","Hold the last word as long as you can."],
       es:["Dale palmaditas lentas en la espalda al ritmo.","Baja la voz en cada estrofa; la última es casi un susurro.","Sostén la última palabra lo más que puedas."]},
  stanzas:[
    [L("Señora Santa Ana,","Lady Saint Anne,"),L("¿por qué llora el niño?","why is the baby crying?"),L("Por una manzana","Over an apple"),L("que se le ha perdido.","that he has lost.")],
    [L("Vamos a la huerta,","Let's go to the orchard,"),L("cortaremos dos:","we'll pick two:"),L("una para el niño","one for the baby"),L("y otra para vos.","and one for you.")],
    [L("Duérmete, mi niño,","Sleep, my child,"),L("duérmete, mi sol,","sleep, my sunshine,"),L("duérmete, pedazo","sleep, little piece"),L("de mi corazón.","of my heart.")]],
  vocab:[L("llorar","to cry"),L("manzana","apple"),L("huerta","orchard"),L("sol","sun"),L("corazón","heart"),L("pedazo","piece")] },

{ id:"elefante", cat:"animales", title:"Un elefante se balanceaba", open:true,
  note:{en:"A counting song that goes as high as you like. The fun is the ending: the web finally gives way and everyone tumbles. <b>Tela de araña</b> is a spider's web.",
        es:"Una canción para contar hasta donde quieran. Lo divertido es el final: la telaraña por fin se rompe y todos se caen. <b>Tela de araña</b> es telaraña."},
  how:{en:["Sway side to side like an elephant on a wobbly web.","Hold up fingers for the number.","Decide together which number breaks the web, then fall down laughing."],
       es:["Balancéense de lado a lado como elefantes en una telaraña.","Levanten los dedos con el número.","Decidan juntos en qué número se rompe la telaraña, y cáiganse riendo."]},
  stanzas:[
    [L("Un elefante se balanceaba","One elephant was swinging"),L("sobre la tela de una araña.","on a spider's web."),L("Como veía que resistía,","When he saw that it held,"),L("fue a llamar a otro elefante.","he went to call another elephant.")],
    [L("Dos elefantes se balanceaban","Two elephants were swinging"),L("sobre la tela de una araña.","on a spider's web."),L("Como veían que resistía,","When they saw that it held,"),L("fueron a llamar a otro elefante.","they went to call another elephant.")],
    [L("Tres elefantes se balanceaban","Three elephants were swinging"),L("sobre la tela de una araña.","on a spider's web."),L("Como veían que resistía,","When they saw that it held,"),L("fueron a llamar a otro elefante.","they went to call another elephant.")]],
  vocab:[L("elefante","elephant"),L("araña","spider"),L("tela de araña","spider's web"),L("uno, dos, tres","one, two, three"),L("otro","another"),L("llamar","to call")] },

{ id:"rana", cat:"animales", title:"Cucú, cantaba la rana",
  note:{en:"In Spanish a frog does not say ribbit, it says <b>cucú</b>. The song is a parade of people passing by, so it teaches who and what without trying.",
        es:"En español la rana no dice ribbit, dice <b>cucú</b>. La canción es un desfile de gente que pasa, así que enseña quién y qué sin esfuerzo."},
  how:{en:["The child sings every cucú, cucú. You sing the rest.","Act out each passer-by: tip a hat, swish a gown, sell rosemary.","Pretend to cry on the last line, then laugh."],
       es:["El niño canta todos los cucú, cucú. Tú cantas lo demás.","Actúa cada personaje: el sombrero, el vestido, el romero.","Haz que lloras en la última línea, y luego ríete."]},
  stanzas:[
    [L("Cucú, cucú, cantaba la rana,","Ribbit, ribbit, sang the frog,"),L("cucú, cucú, debajo del agua.","ribbit, ribbit, under the water."),L("Cucú, cucú, pasó un caballero,","Ribbit, ribbit, a gentleman went by,"),L("cucú, cucú, con capa y sombrero.","ribbit, ribbit, with a cape and a hat.")],
    [L("Cucú, cucú, pasó una señora,","Ribbit, ribbit, a lady went by,"),L("cucú, cucú, con traje de cola.","ribbit, ribbit, in a gown with a train."),L("Cucú, cucú, pasó un marinero,","Ribbit, ribbit, a sailor went by,"),L("cucú, cucú, vendiendo romero.","ribbit, ribbit, selling rosemary.")],
    [L("Cucú, cucú, le pidió un ramito,","Ribbit, ribbit, she asked him for a sprig,"),L("cucú, cucú, no le quiso dar,","ribbit, ribbit, he would not give her one,"),L("cucú, cucú, y se echó a llorar.","ribbit, ribbit, and she burst into tears.")]],
  vocab:[L("rana","frog"),L("agua","water"),L("caballero","gentleman"),L("sombrero","hat"),L("señora","lady"),L("marinero","sailor"),L("llorar","to cry")] },

{ id:"perritos", cat:"animales", title:"Los diez perritos",
  note:{en:"Counting down from ten with a rhyme for every number. Each puppy leaves for a silly reason. This is how a lot of Mexican kids learned <b>nueve, ocho, siete</b>.",
        es:"Cuenta regresiva del diez con una rima para cada número. Cada perrito se va por una razón chistosa. Así aprendieron muchos niños mexicanos <b>nueve, ocho, siete</b>."},
  how:{en:["Start with ten fingers up. Fold one down each verse.","Let the child shout the number at the end of each verse.","Bark once when the last puppy goes."],
       es:["Empieza con los diez dedos arriba. Baja uno en cada estrofa.","Deja que el niño grite el número al final de cada estrofa.","Ladren una vez cuando se va el último perrito."]},
  stanzas:[
    [L("Yo tenía diez perritos,","I had ten little puppies,"),L("yo tenía diez perritos.","I had ten little puppies."),L("Uno se perdió en la nieve,","One got lost in the snow,"),L("no me quedan más que nueve.","now I only have nine.")],
    [L("De los nueve que tenía,","Of the nine I had,"),L("uno se comió un bizcocho,","one ate a biscuit,"),L("no me quedan más que ocho.","now I only have eight.")],
    [L("De los ocho que tenía,","Of the eight I had,"),L("uno se subió a un cohete,","one climbed onto a rocket,"),L("no me quedan más que siete.","now I only have seven.")],
    [L("De los siete que tenía,","Of the seven I had,"),L("uno se fue con Moisés,","one went off with Moisés,"),L("no me quedan más que seis.","now I only have six.")],
    [L("De los seis que tenía,","Of the six I had,"),L("uno se pegó un brinco,","one took a big jump,"),L("no me quedan más que cinco.","now I only have five.")],
    [L("De los cinco que tenía,","Of the five I had,"),L("uno se fue al teatro,","one went to the theater,"),L("no me quedan más que cuatro.","now I only have four.")],
    [L("De los cuatro que tenía,","Of the four I had,"),L("uno se volteó al revés,","one flipped upside down,"),L("no me quedan más que tres.","now I only have three.")],
    [L("De los tres que tenía,","Of the three I had,"),L("uno se enfermó de tos,","one came down with a cough,"),L("no me quedan más que dos.","now I only have two.")],
    [L("De los dos que tenía,","Of the two I had,"),L("uno se fue con Bruno,","one went off with Bruno,"),L("no me queda más que uno.","now I only have one.")],
    [L("Y el uno que tenía","And the one I had"),L("se fue al campo un día,","went off to the countryside one day,"),L("y ya no me queda ninguno.","and now I have none at all.")]],
  vocab:[L("perrito","puppy"),L("diez","ten"),L("nueve","nine"),L("ocho","eight"),L("siete","seven"),L("nieve","snow"),L("brinco","jump"),L("ninguno","none")] },

{ id:"colores", cat:"animales", title:"De colores",
  note:{en:"An old song that came to Mexico from Spain and became the anthem of the farmworkers' movement in California. For Mexican-American families it carries both places at once. The second verse is a barnyard.",
        es:"Una canción vieja que llegó a México de España y se volvió el himno del movimiento campesino en California. Para las familias mexicoamericanas lleva los dos lugares a la vez. La segunda estrofa es un corral."},
  how:{en:["Paint the air with big brushstrokes on de colores.","Make a rainbow arch with both arms on arcoíris.","Crow, cluck and peep with the rooster, the hen and the chicks."],
       es:["Pinta el aire con brochazos grandes en de colores.","Haz un arco con los dos brazos en arcoíris.","Canten como el gallo, la gallina y los pollitos."]},
  stanzas:[
    [L("De colores, de colores","In colors, in colors"),L("se visten los campos en la primavera.","the fields dress themselves in spring."),L("De colores, de colores","In colors, in colors"),L("son los pajaritos que vienen de afuera.","are the little birds that come from far away."),L("De colores, de colores","In colors, in colors"),L("es el arcoíris que vemos lucir.","is the rainbow we see shining."),L("Y por eso los grandes amores","And that is why the great loves"),L("de muchos colores me gustan a mí.","of many colors are the ones I like.")],
    [L("Canta el gallo, canta el gallo","The rooster sings, the rooster sings"),L("con el quiri, quiri, quiri, quiri, quiri.","with his cock-a-doodle-doo."),L("La gallina, la gallina","The hen, the hen"),L("con el cara, cara, cara, cara, cara.","with her cluck, cluck, cluck."),L("Los pollitos, los pollitos","The chicks, the chicks"),L("con el pío, pío, pío, pío, pí.","with their peep, peep, peep."),L("Y por eso los grandes amores","And that is why the great loves"),L("de muchos colores me gustan a mí.","of many colors are the ones I like.")]],
  vocab:[L("colores","colors"),L("campo","field, countryside"),L("primavera","spring"),L("pajarito","little bird"),L("arcoíris","rainbow"),L("gallo","rooster"),L("me gustan","I like them")] },

{ id:"caballito", cat:"animales", title:"Caballito blanco",
  note:{en:"A song about the <b>pueblo</b> you come from. A natural moment to name the town where abuela or abuelo was born.",
        es:"Una canción sobre el <b>pueblo</b> de donde uno viene. Un momento natural para nombrar el pueblo donde nació la abuela o el abuelo."},
  how:{en:["Bounce the child on your knee like a horse.","Say the name of your family's town on mi pueblo.","Count three sheep on your fingers."],
       es:["Brinca al niño en la rodilla como caballito.","Di el nombre del pueblo de tu familia en mi pueblo.","Cuenta tres ovejas con los dedos."]},
  stanzas:[
    [L("Caballito blanco,","Little white horse,"),L("llévame de aquí,","take me away from here,"),L("llévame a mi pueblo","take me to my town"),L("donde yo nací.","where I was born.")],
    [L("Tengo, tengo, tengo,","I have, I have, I have,"),L("tú no tienes nada,","you have nothing at all,"),L("tengo tres ovejas","I have three sheep"),L("en una cabaña.","in a little cabin.")],
    [L("Una me da leche,","One gives me milk,"),L("otra me da lana,","another gives me wool,"),L("y otra me mantiene","and the other keeps me fed"),L("toda la semana.","all week long.")]],
  vocab:[L("caballo","horse"),L("blanco","white"),L("pueblo","town, village"),L("oveja","sheep"),L("leche","milk"),L("lana","wool"),L("semana","week")] },

{ id:"vibora", cat:"jugar", title:"A la víbora de la mar",
  note:{en:"The game at every Mexican wedding: the couple stand on chairs holding the veil as a bridge and the guests snake underneath. At home two grown-ups make the arch. Whoever gets caught on <b>tras, tras, tras</b> picks melón or sandía.",
        es:"El juego de toda boda mexicana: los novios se suben a las sillas con el velo como puente y los invitados pasan en fila debajo. En casa, dos adultos hacen el arco. A quien atrapan en <b>tras, tras, tras</b> escoge melón o sandía."},
  how:{en:["Two people join hands high to make an arch.","Everyone else holds hands in a line and runs under, again and again.","The arch drops on tras, tras, tras and traps someone.","The trapped one whispers melón or sandía and joins that side."],
       es:["Dos personas se toman de las manos en alto para hacer un arco.","Los demás se toman de las manos en fila y pasan por debajo, una y otra vez.","El arco baja en tras, tras, tras y atrapa a alguien.","El atrapado dice en secreto melón o sandía y se pasa a ese lado."]},
  stanzas:[
    [L("A la víbora, víbora","To the snake, the snake"),L("de la mar, de la mar,","of the sea, of the sea,"),L("por aquí pueden pasar.","this way you may pass."),L("Los de adelante corren mucho","The ones in front run fast"),L("y los de atrás se quedarán,","and the ones behind will stay,"),L("tras, tras, tras, tras.","stay, stay, stay, stay.")],
    [L("Una mexicana","A Mexican woman"),L("que fruta vendía:","who sold fruit:"),L("ciruela, chabacano,","plum, apricot,"),L("melón o sandía.","melon or watermelon.")],
    [L("Verbena, verbena,","Verbena, verbena,"),L("jardín de matatena.","garden of jacks."),L("Verbena, verbena,","Verbena, verbena,"),L("la Virgen de la Cueva.","the Virgin of the Cave.")],
    [L("Campanita de oro,","Little golden bell,"),L("déjame pasar","let me pass"),L("con todos mis hijos,","with all my children,"),L("menos el de atrás,","except the one at the back,"),L("tras, tras, tras, tras.","back, back, back, back.")],
    [L("Será melón, será sandía,","Will it be melon, will it be watermelon,"),L("será la vieja del otro día,","will it be the old lady from the other day,"),L("día, día, día, día.","day, day, day, day.")]],
  vocab:[L("víbora","snake"),L("mar","sea"),L("fruta","fruit"),L("ciruela","plum"),L("chabacano","apricot (Mexico)"),L("melón","melon"),L("sandía","watermelon"),L("campanita","little bell")] },

{ id:"naranja", cat:"jugar", title:"Naranja dulce",
  note:{en:"A circle game with a hug in the middle of it. <b>Sololoy</b> is how children said celuloide, the plastic old dolls were made of. The tacos line at the end always gets a laugh.",
        es:"Una ronda con un abrazo a la mitad. <b>Sololoy</b> es como los niños decían celuloide, el plástico de las muñecas de antes. La línea de los tacos al final siempre da risa."},
  how:{en:["Hold hands in a circle and walk around while singing.","On dame un abrazo, hug the person next to you.","March in place on toca la marcha.","On no le doy, everyone sits down fast."],
       es:["Tómense de las manos en círculo y caminen mientras cantan.","En dame un abrazo, abraza a quien tengas al lado.","Marchen en su lugar en toca la marcha.","En no le doy, todos se sientan rápido."]},
  stanzas:[
    [L("Naranja dulce,","Sweet orange,"),L("limón partido,","lemon cut in half,"),L("dame un abrazo","give me a hug,"),L("que yo te pido.","I'm asking you.")],
    [L("Si fueran falsos","If my promises"),L("mis juramentos,","were false,"),L("en poco tiempo","in a little while"),L("se olvidarán.","they will be forgotten.")],
    [L("Toca la marcha,","Play the march,"),L("mi pecho llora,","my heart is crying,"),L("adiós, señora,","goodbye, señora,"),L("yo ya me voy","I'm off now")],
    [L("a mi casita","to my little house"),L("de sololoy,","made of celluloid,"),L("a comer tacos","to eat tacos"),L("y no le doy.","and I won't share.")]],
  vocab:[L("naranja","orange"),L("dulce","sweet"),L("limón","lemon, lime"),L("abrazo","hug"),L("adiós","goodbye"),L("casita","little house"),L("tacos","tacos")] },

{ id:"blanca", cat:"jugar", title:"Doña Blanca",
  note:{en:"A Mexican <b>ronda</b> known since colonial times. A jicote is a big wasp, from the Nahuatl xicotli, so this game carries an indigenous word in it.",
        es:"Una <b>ronda</b> mexicana conocida desde la época colonial. Un jicote es una avispa grande, del náhuatl xicotli, así que este juego lleva una palabra indígena."},
  how:{en:["One child is Doña Blanca and stands in the middle.","The others hold hands around her: they are the pillars.","One child outside is the jicotillo. On the last line it tries to break through the pillars to reach Doña Blanca."],
       es:["Un niño es Doña Blanca y se para en medio.","Los demás se toman de las manos alrededor: son los pilares.","Un niño afuera es el jicotillo. En la última línea trata de romper los pilares para llegar a Doña Blanca."]},
  stanzas:[
    [L("Doña Blanca está cubierta","Doña Blanca is surrounded"),L("de pilares de oro y plata.","by pillars of gold and silver."),L("Romperemos un pilar","We will break a pillar"),L("para ver a Doña Blanca.","to see Doña Blanca.")],
    [L("¿Quién es ese jicotillo","Who is that little wasp"),L("que anda en pos de Doña Blanca?","chasing after Doña Blanca?"),L("Yo soy ese jicotillo","I am that little wasp"),L("que anda en pos de Doña Blanca.","chasing after Doña Blanca.")]],
  vocab:[L("oro","gold"),L("plata","silver"),L("pilar","pillar"),L("romper","to break"),L("jicote","big wasp (Mexico)"),L("¿quién?","who?")] },

{ id:"arroz", cat:"jugar", title:"Arroz con leche",
  note:{en:"Also a dessert: rice cooked in milk with cinnamon and sugar. Sing it, then make it together and you have a whole afternoon. The line <b>con esta sí, con esta no</b> is for choosing.",
        es:"También es un postre: arroz cocido en leche con canela y azúcar. Cántenla y luego háganlo juntos y ya tienen una tarde entera. La línea <b>con esta sí, con esta no</b> es para escoger."},
  how:{en:["Circle, holding hands, one child in the middle.","The middle child mimes sewing and embroidering.","On con esta sí, con esta no, they point at people in the circle and pick a partner on the last line."],
       es:["Ronda tomados de las manos, un niño en medio.","El de en medio hace como que cose y borda.","En con esta sí, con esta no, señala a los de la ronda y escoge pareja en la última línea."]},
  stanzas:[
    [L("Arroz con leche,","Rice pudding,"),L("me quiero casar","I want to marry"),L("con una señorita","a young lady"),L("de la capital,","from the capital,")],
    [L("que sepa coser,","who knows how to sew,"),L("que sepa bordar,","who knows how to embroider,"),L("que sepa abrir la puerta","who knows how to open the door"),L("para ir a jugar.","to go out and play.")],
    [L("Yo soy la viudita","I am the little widow"),L("del barrio del rey,","from the king's neighborhood,"),L("me quiero casar","I want to marry"),L("y no sé con quién.","and I don't know whom.")],
    [L("Con esta sí,","With this one, yes,"),L("con esta no,","with this one, no,"),L("con esta señorita","with this young lady"),L("me caso yo.","I'll marry.")]],
  vocab:[L("arroz","rice"),L("leche","milk"),L("casarse","to get married"),L("puerta","door"),L("jugar","to play"),L("sí / no","yes / no")] },

{ id:"muneca", cat:"jugar", title:"Tengo una muñeca",
  note:{en:"The counting verse is how many Mexican kids first learned to add by eight. Watch the false friend: <b>constipado</b> means she caught a cold, nothing else.",
        es:"La estrofa de los números es como muchos niños mexicanos aprendieron a sumar de ocho en ocho. Ojo con la palabra: <b>constipado</b> quiere decir resfriado."},
  how:{en:["Cradle a doll or a stuffed animal in your arms.","Feed it pretend syrup with a fork on jarabe.","Hold up fingers for the sums, and cheer at treinta y dos."],
       es:["Acuna una muñeca o un peluche en los brazos.","Dale jarabe de mentiras con un tenedor en jarabe.","Cuenta las sumas con los dedos y celebren en treinta y dos."]},
  stanzas:[
    [L("Tengo una muñeca","I have a doll"),L("vestida de azul,","dressed in blue,"),L("con su camisita","with her little blouse"),L("y su canesú.","and her bodice.")],
    [L("La saqué a paseo,","I took her out for a walk,"),L("se me constipó,","she caught a cold,"),L("la tengo en la cama","I have her in bed"),L("con mucho dolor.","in a lot of pain.")],
    [L("Esta mañanita","This morning"),L("me dijo el doctor","the doctor told me"),L("que le dé jarabe","to give her syrup"),L("con un tenedor.","with a fork.")],
    [L("Dos y dos son cuatro,","Two and two are four,"),L("cuatro y dos son seis,","four and two are six,"),L("seis y dos son ocho","six and two are eight"),L("y ocho, dieciséis,","and eight, sixteen,")],
    [L("y ocho, veinticuatro,","and eight, twenty-four,"),L("y ocho, treinta y dos;","and eight, thirty-two;"),L("ánimas benditas,","blessed souls,"),L("me arrodillo yo.","I kneel down.")]],
  vocab:[L("muñeca","doll"),L("azul","blue"),L("paseo","a walk, an outing"),L("cama","bed"),L("doctor","doctor"),L("jarabe","syrup"),L("tenedor","fork"),L("dieciséis","sixteen")] },

{ id:"barquito", cat:"jugar", title:"El barquito chiquitito",
  note:{en:"A loop song: when it ends, it starts again, and children beg for <b>otra vez</b>. Chiquitito is chico made small twice over.",
        es:"Una canción que da vuelta: cuando termina, vuelve a empezar, y los niños piden <b>otra vez</b>. Chiquitito es chico hecho pequeño dos veces."},
  how:{en:["Rock side to side like a boat.","Count the weeks on your fingers.","Sing each round a little faster than the last."],
       es:["Mécete de lado a lado como barquito.","Cuenta las semanas con los dedos.","Canten cada vuelta un poco más rápido que la anterior."]},
  stanzas:[
    [L("Había una vez","Once upon a time"),L("un barquito chiquitito,","there was a tiny little boat,"),L("había una vez","once upon a time"),L("un barquito chiquitito,","there was a tiny little boat,"),L("que no sabía, que no podía,","that didn't know how, that couldn't,"),L("que no podía navegar.","that couldn't sail.")],
    [L("Pasaron un, dos, tres,","One, two, three,"),L("cuatro, cinco, seis semanas,","four, five, six weeks went by,"),L("pasaron un, dos, tres,","one, two, three,"),L("cuatro, cinco, seis semanas,","four, five, six weeks went by,"),L("y aquel barquito, y aquel barquito,","and that little boat, and that little boat,"),L("y aquel barquito navegó.","and that little boat sailed away.")],
    [L("Y si esta historia","And if this story"),L("parece corta,","seems short,"),L("volveremos, volveremos","we'll go back, we'll go back"),L("a empezar.","to the beginning.")]],
  vocab:[L("barco","boat"),L("chiquito","tiny"),L("navegar","to sail"),L("semana","week"),L("había una vez","once upon a time"),L("otra vez","again")] },

{ id:"dedito", cat:"manos", title:"Este dedito",
  note:{en:"A finger play that starts at the pinky and ends with the thumb, <b>el gordito</b>, eating the egg. Every Spanish-speaking family has its own version.",
        es:"Un juego de dedos que empieza en el meñique y termina con el pulgar, <b>el gordito</b>, comiéndose el huevo. Cada familia tiene su versión."},
  how:{en:["Take the child's hand and touch one finger per line, starting with the little one.","Wiggle the thumb on gordito goloso.","Tickle the palm on se lo comió."],
       es:["Toma la mano del niño y toca un dedo por línea, empezando por el meñique.","Mueve el pulgar en gordito goloso.","Hazle cosquillas en la palma en se lo comió."]},
  stanzas:[
    [L("Este dedito compró un huevito,","This little finger bought a little egg,"),L("este dedito lo puso a cocer,","this little finger put it on to boil,"),L("este dedito le echó la sal,","this little finger salted it,"),L("este dedito lo revolvió,","this little finger stirred it,"),L("y este gordito goloso","and this chubby greedy one"),L("se lo comió.","ate it all up.")]],
  vocab:[L("dedo","finger"),L("dedito","little finger"),L("huevo","egg"),L("sal","salt"),L("gordito","chubby one"),L("goloso","greedy for sweets"),L("comer","to eat")] },

{ id:"sana", cat:"manos", title:"Sana, sana, colita de rana",
  note:{en:"Not a song but the rhyme every Mexican parent says while rubbing a bumped knee. It works because it is said the same way every time. <b>Colita</b> is a little tail.",

const MELODIES = {

/* ================= speech ================= */
const SPEECH = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let VOICE = null, VOICE_CHECKED = false;
function pickVoice(){
  if (!SPEECH) return;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  VOICE_CHECKED = true;
  // skip novelty voices (macOS ships Eddy, Flo, Grandma… in every language) and prefer Mexico, then US/Latin America, then any Spanish
  const novelty = /^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|good news|bad news|albert|fred|junior|kathy|ralph)\b/i;
  const es = vs.filter(v => /^es/i.test(v.lang));
  const natural = es.filter(v => !novelty.test(v.name));
  const pool = natural.length ? natural : es;
  const by = re => pool.find(v => re.test(v.lang));
  VOICE = pool.find(v => /paulina/i.test(v.name)) || by(/es[-_]MX/i) || by(/es[-_]US/i) || by(/es[-_]419/i) || pool[0] || null;
  $$(".voice-note").forEach(el => { el.hidden = !!VOICE; });
}
if (SPEECH) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speakQueue = null;
function stopSpeech(){ if (SPEECH) speechSynthesis.cancel(); speakQueue = null; }
function utter(text, slow){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = VOICE ? VOICE.lang : "es-MX";
  if (VOICE) u.voice = VOICE;
  u.rate = slow ? 0.5 : 0.9; u.pitch = 1.05;
  return u;
}
function speak(text, slow){
  if (!SPEECH) { toast(T(I.no_speech)); return; }
  stopSpeech();
  speechSynthesis.speak(utter(text, slow == null ? SLOW : slow));
}
// speak a list of lines, calling onLine(i) as each starts
function speakLines(lines, onLine, onEnd, onWord){
  if (!SPEECH) { toast(T(I.no_speech)); if (onEnd) onEnd(); return; }
  stopSpeech();
  const token = {}; speakQueue = token;
  lines.forEach((txt, i) => {
    const u = utter(txt, SLOW);
    u.onstart = () => { if (speakQueue === token && onLine) onLine(i); };
    if (onWord) u.onboundary = e => { if (speakQueue === token && e.name === "word") onWord(i, e.charIndex); };
    if (i === lines.length - 1) u.onend = () => { if (speakQueue === token) { speakQueue = null; if (onEnd) onEnd(); } };
    speechSynthesis.speak(u);
  });
}

/* ================= hummed tune ================= */
let ctx = null, master = null, tuneTimers = [], tuneToken = null, tuneBus = null;
function audio(){
  if (ctx) return ctx;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0.45; master.connect(ctx.destination);
  return ctx;
}
function hum(freq, t0, dur, bus){
  const c = audio();
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0);
  const a = Math.min(0.08, dur*0.25), r = Math.min(0.12, dur*0.3);
  g.gain.exponentialRampToValueAtTime(0.8, t0+a); g.gain.setValueAtTime(0.8, t0+dur-r); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 0.7;
  const o1 = c.createOscillator(); o1.type = "sine"; o1.frequency.value = freq;
  const o2 = c.createOscillator(); o2.type = "triangle"; o2.frequency.value = freq*2; const g2 = c.createGain(); g2.gain.value = 0.08;
  const lfo = c.createOscillator(); lfo.frequency.value = 5.2; const lg = c.createGain(); lg.gain.value = freq*0.004; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
  o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(bus || master);
  o1.start(t0); o2.start(t0); lfo.start(t0); const end = t0+dur+0.05; o1.stop(end); o2.stop(end); lfo.stop(end);
}
// every performance plays through its own bus; stopping fades that bus out and disconnects it, which silences notes already scheduled on the audio clock
function stopTune(){
  tuneTimers.forEach(clearTimeout); tuneTimers = []; tuneToken = null;
  if (tuneBus && ctx) { const b = tuneBus; tuneBus = null; b.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.02); setTimeout(()=>{ try { b.disconnect(); } catch(e){} }, 250); }
}
// play the song's melody through all stanzas; onLine(flatIndex)
function playTune(song, onLine, onEnd, from){
  stopTune(); stopSpeech();
  const m = MELODIES[song.melody]; if (!m) return;
  const c = audio(); if (c.state === "suspended") c.resume();
  const beat = 60/(m.bpm * (SLOW ? 0.7 : 1)); let t = c.currentTime + 0.15; const token = {}; tuneToken = token; // Slow also slows the tune
  const bus = c.createGain(); bus.gain.value = 1; bus.connect(master); tuneBus = bus;
  const at = (when, fn) => tuneTimers.push(setTimeout(()=>{ if (tuneToken === token) fn(); }, Math.max(0, (when - c.currentTime)*1000)));
  let flat = 0;
  song.stanzas.forEach((st, si) => {
    st.forEach((ln, li) => {
      const ml = m.lines[li % m.lines.length];
      const fi = flat; flat++;
      if (from && fi < from) return; // start partway through
      const durMs = ml.d.reduce((a, b) => a + b, 0) * beat * 1000;
      const starts = []; let acc = 0; ml.d.forEach(d => { starts.push(Math.round(acc * beat * 1000)); acc += d; });
      at(t, ()=>{ if (onLine) onLine(fi, durMs, starts); });
      ml.n.forEach((deg, k) => { const f = m.base * Math.pow(2, DEG[deg]/12) * 0.5; const d = ml.d[k]*beat; hum(f, t, d*0.95, bus); t += d; });
    });
    if (!from || flat > from) t += beat*0.8;
  });
  at(t+0.1, ()=>{ tuneToken = null; tuneBus = null; if (onEnd) onEnd(); });
}
function stopAll(){ stopSpeech(); stopTune(); }

/* ================= routing ================= */
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  stopAll();
  closeSing();
  if (parts[0] === "song" && songOf(parts[1])) { renderSong(songOf(parts[1])); if (parts[2] === "sing") openSing(songOf(parts[1])); }
  else if (parts[0] === "palabras" || parts[0] === "words") renderWords(parts[1] === "frases" ? "phrases" : "words");
  else if (parts[0] === "tour") { if (!$("#view").children.length) renderLibrary(); openTour(parseInt(parts[1] || "0", 10) || 0); return; }
  else renderLibrary();
  closeTour();
  window.scrollTo({ top: 0 });
}
function renderNav(){
  const h = location.hash.replace(/^#\/?/, "");
  const cur = h.startsWith("song") || h === "" ? "songs" : h.startsWith("palabras") || h.startsWith("words") ? "words" : h.startsWith("tour") ? "tour" : "";
  $("#nav").innerHTML = `
    <a href="#/" ${cur==="songs"?'aria-current="page"':""}>${T(I.nav_songs)}</a>
    <a href="#/palabras" ${cur==="words"?'aria-current="page"':""}>${T(I.nav_words)}</a>
    <a href="#/tour/0" ${cur==="tour"?'aria-current="page"':""}>${T(I.nav_tour)}</a>`;
  $$(".langsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false"));
  document.documentElement.lang = LANG;
  document.documentElement.dataset.lang = LANG;
}
function setLang(l){
  LANG = l; try { localStorage.setItem("cantame-lang", l); } catch(e){}
  renderNav(); route();
}

function flatLines(s){ const out = []; s.stanzas.forEach((st, si) => st.forEach((ln, li) => out.push({ si, li, ...ln }))); return out; }
function lineHTML(ln, idx, extra){

function renderSong(s){

  $("#view").innerHTML = `<div class="fade">

    <div class="song-head">

/* ================= syllables: line up words with notes ================= */
const VOW = /[aeiouáéíóúü]/, STRONG = /[aeoáéó]/, ACC_WEAK = /[íú]/;
function sylCount(word){
  const w = word.toLowerCase().replace(/[^a-záéíóúüñ]/g, ""); if (!w) return 0;
  let n = 0, prev = "";
  for (const ch of w) {
    const v = VOW.test(ch);
    if (v) { if (!VOW.test(prev) || (STRONG.test(prev) && STRONG.test(ch)) || ACC_WEAK.test(ch) || ACC_WEAK.test(prev)) n++; }
    prev = ch;
  }
  return Math.max(1, n);
}
// map each word of a line to the index of the note it starts on, given the line has N notes
function wordNoteIndex(words, N){
  const syl = words.map(w => sylCount(w.t));
  let total = syl.reduce((a, b) => a + b, 0);
  // synalepha: a word ending in a vowel runs into a following word that starts with a vowel (or h + vowel)
  for (let k = 1; k < words.length && total > N; k++) {
    const a = words[k - 1].t.toLowerCase().replace(/[^a-záéíóúüñy]/g, ""), b = words[k].t.toLowerCase().replace(/^h/, "");
    if (a && b && /[aeiouáéíóúy]$/.test(a) && VOW.test(b[0]) && syl[k] > 0) { syl[k]--; total--; }
  }
  const idx = []; let acc = 0;
  words.forEach((w, k) => { idx.push(Math.min(N - 1, Math.round(acc * N / Math.max(total, 1)))); acc += syl[k]; });
  return idx;
}

/* ================= sing-along: a scrolling reel ================= */

function wordsWithOffsets(text){ const out = []; const re = /\S+/g; let m; while ((m = re.exec(text))) out.push({ t: m[0], at: m.index }); return out; }

        ${s.stanzas.length > 1 && l.li === 0 ? `<div class="rcue">${T(I.cue_stanza)} ${l.si + 1}</div>` : ""}
        <div class="rtext">${words[li].map((w, k) => `<span class="w" data-k="${k}">${esc(w.t)}</span>`).join(" ")}</div>
        <div class="rgl">${esc(l.en)}</div></div>`).join("")}</div></div>

    <div class="ctl">
      <button class="btn" type="button" data-act="prev" aria-label="${T(I.prev)}">${IC.back}</button>

  document.body.appendChild(o); document.body.style.overflow = "hidden";

  const playBtn = $('[data-act="play"]', o); const hasTune = !!s.melody;

  const center = () => { const l = rlines[i]; const y = wrap.clientHeight / 2 - (l.offsetTop + l.offsetHeight / 2); reel.style.transform = `translateY(${Math.round(y)}px)`; };
  const clearWord = () => $$(".w.on", o).forEach(w => w.classList.remove("on"));
  const setWord = (li, k) => { clearWord(); const w = $(`.rline[data-i="${li}"] .w[data-k="${k}"]`, o); if (w) w.classList.add("on"); };
  const clearFb = () => { fbTimers.forEach(clearTimeout); fbTimers = []; };
  const show = n => {
    i = Math.max(0, Math.min(lines.length - 1, n));

    $('[data-act="prev"]', o).disabled = i === 0; $('[data-act="next"]', o).disabled = i === lines.length - 1;

  // for the tune: each word lights on the note its first syllable is sung on, a hair early so the eye leads the ear
  const LEAD = 70;
  const tickToNotes = (li, starts) => { clearFb(); const idx = wordNoteIndex(words[li], starts.length); idx.forEach((ni, k) => fbTimers.push(setTimeout(()=> setWord(li, k), Math.max(0, starts[ni] - LEAD)))); };
  const setButtons = () => {

  const playVoice = from => {

    const idx = lines.slice(from).map((_, k) => from + k);
    speakLines(idx.map(k => lines[k].es),
      k => { show(from + k); if (!boundarySeen) fbTimers.push(setTimeout(()=>{ if (!boundarySeen) tickWords(from + k, words[from + k].length * (SLOW ? 640 : 340)); }, 250)); },
      () => { if (mode === "voice") { mode = null; clearWord(); setButtons(); } },
      (k, ci) => { const li = from + k; if (li !== i) return; if (!boundarySeen) { boundarySeen = true; clearFb(); } const ws = words[li]; let wi = 0; for (let q = 0; q < ws.length; q++) if (ws[q].at <= ci) wi = q; setWord(li, wi); });
  };
  const playTuneFrom = from => {

  };
  const jump = n => { const wasMode = mode; if (wasMode === "voice") playVoice(Math.max(0, Math.min(lines.length - 1, n))); else if (wasMode === "tune") playTuneFrom(Math.max(0, Math.min(lines.length - 1, n))); else show(n); };
  const next = () => { if (i < lines.length - 1) jump(i + 1); };

  const playFrom = n => hasTune ? playTuneFrom(n) : playVoice(n);

        <span class="mock-nav"><b data-en="Songs" data-es="Canciones">Songs</b><b data-en="Words" data-es="Palabras">Words</b><b>Tutorial</b></span>
        <span class="langsw"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="es" aria-pressed="false">Español</button></span></div>
      <div class="mock-h" data-en="Songs your family already knows" data-es="Canciones que tu familia ya conoce">Songs your family already knows</div>
      <div class="mock-line"><span class="es">Los pollitos dicen, pío, pío, pío</span><span class="stay" data-en="always in Spanish" data-es="siempre en español">always in Spanish</span></div>
    </div>`,
    start(sc){

      set("en");

  browse: {

  },

  read: {
    html: ()=> { const p = songOf("pollitos").stanzas[0];
      return `<div class="scene sc-read">
        ${p.slice(0, 2).map(l => `<div class="rl"><div class="es">${wordsHTML(l.es)}</div><div class="en">${esc(l.en)}</div></div>`).join("")}

    start(sc){
      const hand = addHand(sc); const lines = $$(".rl", sc); const btn = $("[data-eng]", sc);

      steps.push([0, reset]);

        $$(".w", l).forEach(w => { steps.push([t, ()=>{ handTo(sc, hand, w, 0.5, 1.05); w.classList.add("on"); }]); t += 520; });
        steps.push([t, ()=> l.classList.add("glossed")]); t += 700;
      });
      steps.push([t + 300, ()=> handTo(sc, hand, btn)]); t += 1100;
      steps.push([t, ()=>{ tap(hand, btn); sc.classList.add("hide-en"); btn.setAttribute("aria-pressed", "false"); }]); t += 1800;
      steps.push([t, ()=>{ tap(hand, btn); sc.classList.remove("hide-en"); btn.setAttribute("aria-pressed", "true"); }]); t += 1600;
      seq(steps, t);

  listen: {
    html: ()=> { const l = songOf("pollitos").stanzas[0][0];
      return `<div class="scene sc-listen">
        <div class="ll"><span class="es">${wordsHTML(l.es)}</span><button class="spk" type="button" data-w="${esc(l.es)}" aria-label="${T(I.hear)}">${IC.spk}</button>${waves()}</div>
        <div class="row"><button class="btn sm" type="button" data-slowbtn aria-pressed="false">${T(I.slow)}</button><button class="btn sm" type="button" data-tunebtn>${IC.note} ${T(I.play_tune)}</button></div>
        <div class="notes" aria-hidden="true"></div></div>`; },
    start(sc){
      const hand = addHand(sc); const spk = $(".spk", sc), slow = $("[data-slowbtn]", sc), tune = $("[data-tunebtn]", sc), ws = $(".waves", sc), notes = $(".notes", sc);
      const words = $$(".w", sc);
      const say = gap => { ws.classList.remove("on", "slow"); void ws.offsetWidth; ws.classList.add("on"); if (gap > 300) ws.classList.add("slow"); words.forEach((w, i) => { later(i * gap, ()=>{ words.forEach(x => x.classList.remove("on")); w.classList.add("on"); }); }); later(words.length * gap + 200, ()=>{ words.forEach(x => x.classList.remove("on")); ws.classList.remove("on"); }); };
      const floatNotes = ()=>{ notes.innerHTML = ""; ["♪","♫","♪","♩"].forEach((n, i) => { const e = document.createElement("i"); e.textContent = n; e.style.left = (20 + i * 18) + "%"; e.style.animationDelay = (i * 0.18) + "s"; notes.appendChild(e); }); };
      seq([[200, ()=>handTo(sc, hand, spk)], [900, ()=>{ tap(hand, spk); say(280); }],
           [2600, ()=>handTo(sc, hand, slow)], [3300, ()=>{ tap(hand, slow); slow.setAttribute("aria-pressed", "true"); }],
           [4000, ()=>handTo(sc, hand, spk)], [4700, ()=>{ tap(hand, spk); say(650); }],
           [7300, ()=>{ slow.setAttribute("aria-pressed", "false"); handTo(sc, hand, tune); }], [8000, ()=>{ tap(hand, tune); floatNotes(); }]], 10400);
      spk.addEventListener("click", ()=>{ say(slow.getAttribute("aria-pressed") === "true" ? 650 : 280); speak(spk.dataset.w, slow.getAttribute("aria-pressed") === "true"); });
      slow.addEventListener("click", ()=> slow.setAttribute("aria-pressed", slow.getAttribute("aria-pressed") !== "true"));
      tune.addEventListener("click", ()=>{ floatNotes(); const s = songOf("pollitos"); playTune({ ...s, stanzas:[[s.stanzas[0][0]]] }); });
    }
  },

  sing: {
    html: ()=> { const l = songOf("pollitos").stanzas[0];
      return `<div class="scene sc-sing"><div class="phone">
        <div class="preel"><div class="pinner">${l.map((ln, i) => `<div class="pl" data-i="${i}">${wordsHTML(ln.es)}</div>`).join("")}</div></div>
        <div class="pplay">${IC.play} ${T(I.play)}</div></div></div>`; },
    start(sc){
      const hand = addHand(sc); const lines = songOf("pollitos").stanzas[0]; const pls = $$(".pl", sc), inner = $(".pinner", sc), wrap = $(".preel", sc), play = $(".pplay", sc);
      const center = i => { pls.forEach((p, k) => { p.classList.toggle("cur", k === i); }); const y = wrap.clientHeight / 2 - (pls[i].offsetTop + pls[i].offsetHeight / 2); inner.style.transform = `translateY(${Math.round(y)}px)`; };
      const steps = [[0, ()=>{ $$(".w.on", sc).forEach(w => w.classList.remove("on")); center(0); play.classList.remove("on"); }], [300, ()=> handTo(sc, hand, play)], [1000, ()=>{ tap(hand, play); play.classList.add("on"); hand.classList.remove("show"); }]];
      let t = 1500; const step = 430;
      lines.forEach((ln, i) => {
        steps.push([t, ()=> center(i)]);
        $$(".w", pls[i]).forEach((w, k) => steps.push([t + 150 + k * step, ()=>{ $$(".w.on", sc).forEach(x => x.classList.remove("on")); w.classList.add("on"); }]));
        t += 150 + $$(".w", pls[i]).length * step + 350;
      });
      steps.push([t, ()=>{ $$(".w.on", sc).forEach(x => x.classList.remove("on")); play.classList.remove("on"); }]);
      seq(steps, t + 1200);
    }
  },

  play: {
    html: ()=> `<div class="scene sc-play">
      <div class="pat" aria-hidden="true">
        <svg class="hl" viewBox="0 0 60 80"><path d="M14 78c-6-1-10-6-11-12L0 48c-.5-2.5 1.5-4.5 4-4l4 1.5V14a4 4 0 0 1 8 0v22h3V6a4 4 0 0 1 8 0v30h3V10a4 4 0 0 1 8 0v26h3V18a4 4 0 0 1 8 0v36c0 14-9 24-24 24z" fill="#F6D2A8" stroke="#8A5A2B" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <div class="tortilla"></div>
        <svg class="hr" viewBox="0 0 60 80"><path d="M14 78c-6-1-10-6-11-12L0 48c-.5-2.5 1.5-4.5 4-4l4 1.5V14a4 4 0 0 1 8 0v22h3V6a4 4 0 0 1 8 0v30h3V10a4 4 0 0 1 8 0v26h3V18a4 4 0 0 1 8 0v36c0 14-9 24-24 24z" fill="#F6D2A8" stroke="#8A5A2B" stroke-width="2.5" stroke-linejoin="round"/></svg>
      </div>
      <div class="syl">${[["Tor","ti","lli","tas","de","man","te","ca"],["pa'","ma","má","que es","tá","con","ten","ta"]].map(line => `<div class="sl">${line.map(s => `<span class="s">${esc(s)}</span>`).join("")}</div>`).join("")}</div>
      <div class="cap">${esc(songOf("tortillitas").title)}</div></div>`,
    start(sc){
      const pat = $(".pat", sc); const lines = $$(".sl", sc); const steps = []; let t = 400; const beat = 460;
      lines.forEach((l, li) => {
        $$(".s", l).forEach(s => { steps.push([t, ()=>{ $$(".s.on", sc).forEach(x => x.classList.remove("on")); s.classList.add("on"); pat.classList.add("hit"); }]); steps.push([t + 200, ()=> pat.classList.remove("hit")]); t += beat; });
        t += beat * 0.8;
      });
      steps.push([t, ()=> $$(".s.on", sc).forEach(x => x.classList.remove("on"))]);
      seq(steps, t + 600);
    }
  },

  words: {
    flip(c, on){ c.classList.add("flipping"); setTimeout(()=>{ c.classList.toggle("flip", on); c.classList.remove("flipping"); }, 140); },
    html: ()=> `<div class="scene sc-words"><div class="fcards">${[["gallina","hen"],["frío","cold"],["alas","wings"]].map(([a, b]) => `<div class="fcard" data-w="${a}" tabindex="0" role="button"><div class="in"><div class="f">${a}</div><div class="b">${b}</div></div><button class="spk" type="button" aria-label="${T(I.hear)}">${IC.spk}</button>${waves()}</div>`).join("")}</div></div>`,
    start(sc){
      const hand = addHand(sc); const cards = $$(".fcard", sc);
      const spk = i => $(".spk", cards[i]), wave = i => { const w = $(".waves", cards[i]); w.classList.remove("on"); void w.offsetWidth; w.classList.add("on"); later(1400, ()=> w.classList.remove("on")); };
      const flip = SCENES.words.flip;
      seq([[0, ()=> cards.forEach(c => c.classList.contains("flip") && flip(c, false))], [300, ()=> handTo(sc, hand, cards[0], 0.5, 0.7)], [1000, ()=>{ tap(hand, cards[0]); flip(cards[0], true); }],
           [2200, ()=> handTo(sc, hand, spk(0))], [2900, ()=>{ tap(hand, spk(0)); wave(0); }],
           [4400, ()=> handTo(sc, hand, cards[1], 0.5, 0.7)], [5100, ()=>{ tap(hand, cards[1]); flip(cards[1], true); }],
           [6400, ()=> handTo(sc, hand, cards[2], 0.5, 0.7)], [7100, ()=>{ tap(hand, cards[2]); flip(cards[2], true); }]], 9200);
      cards.forEach((c, i) => { c.addEventListener("click", e => { if (e.target.closest(".spk")) { wave(i); speak(c.dataset.w); return; } flip(c, !c.classList.contains("flip")); }); });
    }
  },

  track: {
    html: ()=> `<div class="scene sc-track"><div class="tt">${esc(songOf("pollitos").title)}</div>
      <div class="week">${T(I.weekdays).map(d => `<div class="day"><b>${d}</b><i>♪</i></div>`).join("")}</div>
      <button class="btn know" type="button" aria-pressed="false">${IC.check} <span>${T(I.know)}</span></button></div>`,
    start(sc){
      const hand = addHand(sc); const days = $$(".day", sc), know = $(".know", sc); const label = $("span", know);
      const steps = [[0, ()=>{ days.forEach(d => d.className = "day"); know.setAttribute("aria-pressed", "false"); label.textContent = T(I.know); }]];
      days.forEach((d, i) => steps.push([300 + i * 420, ()=> d.classList.add(i === 6 ? "done" : "on")]));
      steps.push([3600, ()=> handTo(sc, hand, know)], [4300, ()=>{ tap(hand, know); know.setAttribute("aria-pressed", "true"); label.textContent = T(I.know_on); }]);
      seq(steps, 7000);
      know.addEventListener("click", ()=>{ const on = know.getAttribute("aria-pressed") !== "true"; know.setAttribute("aria-pressed", on); label.textContent = T(on ? I.know_on : I.know); });
    }
  },

  talk: {
    html: ()=> { const lines = [["p","¿Cantamos?","Shall we sing?"],["c","¡Sí!","Yes!"],["p","Ahora tú.","Now you."],["c","Pío, pío, pío…","Peep, peep, peep…"],["p","¡Muy bien! Otra vez.","Very good! Again."]];
      const who = { p: T({en:"You",es:"Tú"}), c: T({en:"Your child",es:"Tu hijo"}) };
      return `<div class="scene sc-talk"><div class="convo">${lines.map(([w, es, en]) => `<div class="turn ${w}"><small>${who[w]}</small><span class="es">${esc(es)}</span><span class="en">${esc(en)}</span></div>`).join("")}</div></div>`; },
    start(sc){
      const turns = $$(".turn", sc); const steps = [[0, ()=> turns.forEach(t => t.classList.remove("on"))]];
      turns.forEach((t, i) => steps.push([400 + i * 1300, ()=> t.classList.add("on")]));

  ready: {
    html: ()=> `<div class="scene sc-ready" aria-hidden="true"><svg viewBox="0 0 200 120"><g class="chick-bob"><ellipse cx="110" cy="84" rx="40" ry="30" fill="#F2A62C"/><circle cx="80" cy="56" r="24" fill="#F2A62C"/><circle cx="73" cy="51" r="3.5" fill="#2A2418"/><path d="M52 58l-12 4 12 4z" fill="#D6337B"/><path d="M108 66c12-8 26-5 34 6" fill="none" stroke="#C97C10" stroke-width="3.5" stroke-linecap="round"/><path d="M96 112v6M124 112v6" stroke="#C97C10" stroke-width="4" stroke-linecap="round"/></g>
      <g class="note-float"><text x="150" y="40" font-size="20" fill="#1F6F9E">♪</text></g><g class="note-float" style="animation-delay:-1.1s"><text x="30" y="34" font-size="18" fill="#D6337B">♫</text></g></svg></div>`,
    start(){}
  },
};

let tourState = null;
function openTour(n){
  if (!tourState) {
    const o = document.createElement("div"); o.className = "tour"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
    document.body.appendChild(o); document.body.style.overflow = "hidden";
    const key = e => { if (!tourState) return; if (e.key === "Escape") { location.hash = "#/"; } else if (e.key === "ArrowRight") tourGo(tourState.i + 1); else if (e.key === "ArrowLeft") tourGo(tourState.i - 1); };
    document.addEventListener("keydown", key);
    tourState = { el:o, key, i:0 };
  }
  tourState.i = Math.max(0, Math.min(STEPS.length - 1, n));
  drawTour();
}
function tourGo(n){
  if (n >= STEPS.length) { finishTour("#/"); return; }
  if (n < 0) return;
  location.hash = `#/tour/${n}`;
}
function finishTour(hash){
  TOUR_SEEN = true; try { localStorage.setItem("cantame-tour-seen","1"); } catch(e){}
  location.hash = hash;
}
function closeTour(){
  if (!tourState) return;
  stopAll(); clearTourAnim();
  document.removeEventListener("keydown", tourState.key);
  tourState.el.remove(); document.body.style.overflow = ""; tourState = null;
}
function drawTour(){
  clearTourAnim(); stopAll();
  const i = tourState.i, st = STEPS[i], o = tourState.el;
  const stepsTotal = STEPS.length - 2;
  const eyebrow = st.eye ? T(st.eye) : `${T(I.step)} ${i} ${T(I.of)} ${stepsTotal}`;
  const sc = SCENES[st.scene];
  o.innerHTML = `<div class="thdr"><div class="in">
      <span class="brand">Cántame <small>${T(I.nav_tour)}</small></span><span class="grow"></span>
      <div class="langsw" role="group"><button type="button" data-tl="en" aria-pressed="${LANG==="en"}">English</button><button type="button" data-tl="es" aria-pressed="${LANG==="es"}">Español</button></div>
      <button class="x" type="button" data-act="close" aria-label="${T(I.close)}">×</button></div>
      <div class="bar"><div class="rail"><i style="width:${Math.round((i+1)/STEPS.length*100)}%"></i></div></div></div>
    <div class="tstage"><div class="tcard anim">
      <span class="eyebrow">${eyebrow}</span>
      <h1>${T(st.h)}</h1>
      <p class="lede">${T(st.lede)}</p>
      ${sc ? sc.html() : ""}
      ${st.tryHash ? `<div class="row" style="justify-content:center;margin-top:.9rem"><button class="btn sm" type="button" data-try="${st.tryHash}">${T(I.try_it)} →</button></div>` : ""}
      ${st.cta ? `<div class="row" style="justify-content:center;margin-top:1.2rem"><button class="btn primary" type="button" data-try="${st.cta.hash}" style="padding:.8rem 1.5rem;font-size:1.08rem">${T(st.cta)}</button></div>` : ""}
    </div></div>
    <div class="tfoot">
      <button class="btn ghost" type="button" data-act="prev" ${i === 0 ? "disabled" : ""}>${IC.back} ${T(I.tour_back)}</button>
      <button class="btn ghost sm" type="button" data-act="skip" style="color:var(--muted)">${i === STEPS.length - 1 ? "" : T(I.tour_skip)}</button>
      <button class="btn primary" type="button" data-act="next">${i === 0 ? T(I.tour_start) : i === STEPS.length - 1 ? T(I.close) : T(I.tour_next)} →</button>
    </div>`;
  $('[data-act="close"]', o).addEventListener("click", ()=> finishTour("#/"));
  $('[data-act="skip"]', o).addEventListener("click", ()=> finishTour("#/"));
  $('[data-act="prev"]', o).addEventListener("click", ()=> tourGo(i - 1));
  $('[data-act="next"]', o).addEventListener("click", ()=> tourGo(i + 1));
  $$("[data-tl]", o).forEach(b => b.addEventListener("click", ()=>{ LANG = b.dataset.tl; try { localStorage.setItem("cantame-lang", LANG); } catch(e){} renderNav(); drawTour(); }));
  $$("[data-try]", o).forEach(b => b.addEventListener("click", ()=> finishTour(b.dataset.try)));
  $(".tstage", o).scrollTop = 0;
  const sceneEl = $(".scene", o);
  if (sc && sceneEl) later(60, ()=> sc.start(sceneEl));
  $('[data-act="next"]', o).focus();
}

/* ================= boot ================= */
$$(".langsw button").forEach(b => b.addEventListener("click", ()=> setLang(b.dataset.lang)));
window.addEventListener("hashchange", ()=>{ renderNav(); route(); });
document.body.classList.toggle("no-gloss", !GLOSS);
renderNav(); route();
})();
</script>
