    color-scheme: light;

      --blue: #7FC3E8; --blue-soft: #1E3B4C; --rosa: #F98CBB; --rosa-soft: #4B2035;

      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 19px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;

  button { font: inherit; color: inherit; cursor: pointer; }

  .stages { display: flex; flex-wrap: wrap; gap: 0.55rem; justify-content: center; }

  .taps .t.on { background: var(--marigold); }

  /* ---------- bottom ---------- */
  .nav { flex: none; background: var(--ground); }

  var e = t0+dur+0.05; o1.stop(e); o2.stop(e); lfo.stop(e);
}
var current = null;
function stopAudio(){
  if(current){ current.cancel(); current = null; }
  if(ctx && master){
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.03);
    setTimeout(function(){ if(master) master.gain.setTargetAtTime(vol*0.5, ctx.currentTime, 0.02); }, 150);
  }
}
function sing(o){
  stopAudio();
  var c = audio(); if(c.state === "suspended") c.resume();
  var beat = 60/o.bpm, t = c.currentTime + 0.15, timers = [];
  function at(w, fn){ timers.push(setTimeout(fn, Math.max(0,(w-c.currentTime)*1000))); }
  [0,1,2,3].forEach(function(li){
    for(var k=0;k<6;k++){
      var f = 293.66*Math.pow(2, DEG[LN[li][k]]/12)*(o.hum?0.5:1), d = DUR[k]*beat;
      note(f, t, d*0.95, o.hum);
      if(o.onSyl){ (function(l,kk,w){ at(w, function(){ o.onSyl(l,kk); }); })(li,k,t); }
      t += d;
    }
    if(o.pauseAfterLine === li && o.pauseSec){
      if(o.onPause){ (function(w,s){ at(w, function(){ o.onPause(s); }); })(t, o.pauseSec); }
      t += o.pauseSec;
    }
  });
  at(t+0.1, function(){ current=null; if(o.onEnd) o.onEnd(); });
  current = { cancel: function(){ timers.forEach(clearTimeout); } };
}

function wireVol(el){ var s = el.querySelector(".vsl"); if(s) s.addEventListener("input", function(){ setVol(s.value/100); }); }
function lyricsHTML(st, id){
  var h = '<div class="lyr" id="' + id + '">';
  for(var li=0; li<4; li++){
    h += "<div>";
    for(var k=0;k<6;k++){
      var sy = st[li][k];
      h += ((k>0 && sy.charAt(0) !== "-") ? " " : "") + '<span class="sy" data-s="' + li + "-" + k + '">' + sy.replace(/^-/,"") + "</span>";
    }
    h += PUNCT[li] + "</div>";
  }
  return h + "</div>";
}
function hotter(box){ return function(l,k){
  var o = box.querySelectorAll(".sy.hot"); for(var i=0;i<o.length;i++) o[i].classList.remove("hot");
  var e = box.querySelector('.sy[data-s="' + l + "-" + k + '"]'); if(e) e.classList.add("hot");
}; }
function clearHot(box){ var o = box.querySelectorAll(".sy.hot"); for(var i=0;i<o.length;i++) o[i].classList.remove("hot"); }
function toggler(btn, play, stop, start){
  var on = false;
  btn.addEventListener("click", function(){
    if(on){ stopAudio(); off(); return; }
    on = true; btn.textContent = T(stop); btn.setAttribute("aria-pressed","true"); start(off);
  });
  function off(){ on = false; btn.textContent = T(play); btn.setAttribute("aria-pressed","false"); }
  return off;
}

    var now = performance.now();

    taps.push(now); if(taps.length > 7) taps.shift();
    if(taps.length < 4){
      ver.className = "verdict";
      ver.textContent = (LANG==="es" ? (4-taps.length) + " más…" : (4-taps.length) + " more…");

    var s = 0; for(var i=1;i<taps.length;i++) s += taps[i]-taps[i-1];
    var bpm = Math.round(60000/(s/(taps.length-1)));

W.metro = { html:function(){
  return '<div class="row"><button class="btn primary lg" id="wPlay">' + (LANG==="es"?"Encender":"Turn on") + "</button>" +
    '<div class="dot" id="wDot"></div>' + volBar() + "</div>";
}, wire:function(el, unlock){
  wireVol(el);
  var b = el.querySelector("#wPlay"), dot = el.querySelector("#wDot"), timer = null;
  b.addEventListener("click", function(){
    if(timer){ clearInterval(timer); timer=null; dot.classList.remove("on");
      b.textContent = LANG==="es"?"Encender":"Turn on"; b.setAttribute("aria-pressed","false"); return; }
    b.setAttribute("aria-pressed","true"); b.textContent = LANG==="es"?"Parar":"Stop";
    var c = audio(); if(c.state==="suspended") c.resume();
    function beat(){
      dot.classList.add("on"); setTimeout(function(){ dot.classList.remove("on"); }, reduced?0:120);
      var t0 = ctx.currentTime + 0.01;
      var o = ctx.createOscillator(); o.type="sine"; o.frequency.value=1400;
      var g = ctx.createGain(); g.gain.setValueAtTime(0.28,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.03);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+0.04);
    }
    beat(); timer = setInterval(beat, 60000/76); unlock();
  });
  el._cleanup = function(){ if(timer) clearInterval(timer); };
} };

W.silence = { html:function(){
  return '<div class="ring" style="margin-bottom:0.6rem"><svg viewBox="0 0 120 120" aria-hidden="true">' +
    '<circle class="trk" cx="60" cy="60" r="50"/><circle class="arc" id="wArc" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314"/>' +
    '<text class="num" id="wNum" x="60" y="72" text-anchor="middle">3</text></svg></div>' +
    '<div class="verdict" id="wState">' + (LANG==="es" ? "Se detiene a la mitad." : "It stops in the middle.") + "</div>" +
    '<div class="row" style="margin-top:0.8rem"><button class="btn primary lg" id="wPlay">' + (LANG==="es"?"Cantar":"Sing") + "</button>" +
    '<button class="btn" data-d="2">2 s</button><button class="btn" data-d="3" aria-pressed="true">3 s</button><button class="btn" data-d="4">4 s</button>' +
    volBar() + "</div>";
}, wire:function(el, unlock){
  wireVol(el);
  var arc = el.querySelector("#wArc"), num = el.querySelector("#wNum"), st = el.querySelector("#wState");
  var b = el.querySelector("#wPlay"), dur = 3, C = 314, ds = el.querySelectorAll("[data-d]");
  for(var i=0;i<ds.length;i++){
    (function(x){ x.addEventListener("click", function(){
      dur = +x.getAttribute("data-d"); num.textContent = dur;
      for(var j=0;j<ds.length;j++) ds[j].setAttribute("aria-pressed", ds[j]===x);
    }); })(ds[i]);
  }
  toggler(b, {en:"Sing",es:"Cantar"}, {en:"Stop",es:"Parar"}, function(off){
    st.className = "verdict"; st.textContent = LANG==="es" ? "Cantando…" : "Singing…";
    sing({ bpm:72, pauseAfterLine:0, pauseSec:dur,
      onPause:function(sec){
        st.className = "verdict fast";
        st.textContent = LANG==="es" ? "Silencio. No digas nada." : "Quiet now. Say nothing.";
        var t0 = performance.now();
        (function frame(){
          var e = (performance.now()-t0)/1000, rem = Math.max(0, sec-e);
          num.textContent = Math.ceil(rem); arc.style.strokeDashoffset = C*(rem/sec);
          if(rem > 0) requestAnimationFrame(frame);
          else {
            st.className = "verdict ok";
            st.textContent = LANG==="es" ? "Y sigue la canción." : "And the song comes back.";
            LOG.silence.push(sec); unlock();
            setTimeout(function(){ arc.style.strokeDashoffset = C; num.textContent = dur; }, 800);
          }
        })();
      }, onEnd:off });
  });
} };

/* ============ engine ============ */
var card = document.getElementById("card"), whereEl = document.getElementById("where");
var fill = document.getElementById("fill"), backBtn = document.getElementById("back");
var nextBtn = document.getElementById("next"), hintEl = document.getElementById("hint");
var i = 0, unlocked = {};

function render(){
  stopAudio();
  if(card._cleanup){ card._cleanup(); card._cleanup = null; }
  var s = S[i], h = "";

  if(s.pic && PIC[s.pic]) h += '<div class="pic">' + PIC[s.pic] + "</div>";
  if(s.eye) h += '<div class="eyebrow ' + (s.eyeClass||"") + '">' + T(s.eye) + "</div>";
  h += "<h1" + (s.huge ? ' class="huge"' : "") + ">" + T(s.h) + "</h1>";
  if(s.lede) h += '<p class="lede">' + T(s.lede) + "</p>";

  if(s.say){
    h += '<div class="say"><p class="es">' + s.say.es + "</p>";
    if(s.say.gl && LANG === "en") h += '<p class="gl">' + T(s.say.gl) + "</p>";
    if(s.say.ph && LANG === "en") h += '<p class="ph"><b>say it:</b> ' + s.say.ph + "</p>";
    h += "</div>";
  }
  if(s.dos){
    h += '<ul class="dolist">';
    s.dos.forEach(function(d, n){ h += '<li><span class="n">' + (n+1) + "</span><span>" + T(d) + "</span></li>"; });
    h += "</ul>";
  }
  if(s.widget){
    var wcls = W[s.widget].bare ? "" : ' class="w"';
    h += "<div" + wcls + ' id="wbox">' + W[s.widget].html(s) + "</div>";
  }

  if(s.watch || s.trap){
    h += '<div class="panels">';
    if(s.watch) h += '<div class="pan go"><span class="ic">✓</span><p>' + T(s.watch) + "</p></div>";
    if(s.trap)  h += '<div class="pan no"><span class="ic">!</span><p>' + T(s.trap) + "</p></div>";
    h += "</div>";
  }
  if(s.coach) h += '<div class="coach">' + T(s.coach) + "</div>";
  if(s.tiny) h += '<p class="tiny">' + T(s.tiny) + "</p>";

  card.className = "card anim" + (s.wide ? " wide" : "");
  card.innerHTML = h;
  void card.offsetWidth;

  if(s.widget){
    var box = document.getElementById("wbox");
    W[s.widget].wire(box, function(){ unlocked[i] = true; refreshNav(); });
    if(box._cleanup) card._cleanup = box._cleanup;
  }

  whereEl.textContent = T(s.part);
  fill.style.width = ((i+1)/S.length*100) + "%";
  refreshNav();
  document.querySelector(".stage").scrollTop = 0;
}

function refreshNav(){
  var s = S[i], gated = !!s.gate && !unlocked[i];
  backBtn.textContent = LANG === "es" ? "Atrás" : "Back";
  backBtn.style.visibility = i === 0 ? "hidden" : "visible";
  nextBtn.textContent = s.cta ? T(s.cta) : (i === S.length-1 ? (LANG==="es"?"Fin":"Done") : (LANG==="es"?"Siguiente":"Next"));
  nextBtn.disabled = gated || i === S.length-1;
  hintEl.textContent = gated ? T(s.gate) : "";
}

function go(n){ i = Math.max(0, Math.min(S.length-1, n)); render(); }
nextBtn.addEventListener("click", function(){ if(!nextBtn.disabled) go(i+1); });
backBtn.addEventListener("click", function(){ go(i-1); });
document.addEventListener("keydown", function(e){
  if(e.target.tagName === "INPUT" || e.target.id === "wPad") return;
  if(e.key === "ArrowRight" && !nextBtn.disabled) go(i+1);
  if(e.key === "ArrowLeft" && i > 0) go(i-1);
});

/* ============ language ============ */
var btnEn = document.getElementById("btnEn"), btnEs = document.getElementById("btnEs");
function setLang(l){
  LANG = l;
  root.setAttribute("data-lang", l); root.setAttribute("lang", l);
  btnEn.setAttribute("aria-pressed", l === "en");
  btnEs.setAttribute("aria-pressed", l === "es");
  try { localStorage.setItem("cantame-lang", l); } catch(err){}
  render();
}
btnEn.addEventListener("click", function(){ if(LANG !== "en") setLang("en"); });
btnEs.addEventListener("click", function(){ if(LANG !== "es") setLang("es"); });
var saved = null;
try { saved = localStorage.getItem("cantame-lang"); } catch(err){}
if(!saved && (navigator.language||"").toLowerCase().indexOf("es") === 0) saved = "es";
setLang(saved === "es" ? "es" : "en");
})();
</script>
